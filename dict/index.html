ده.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"High-Frequency Trading (HFT)","fa":"معاملات بسامد بالا","d":"معاملات الگوریتمی با سرعت بسیار زیاد و تعداد سفارش‌های فراوان.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"Retail Investor","fa":"سرمایه‌گذار خرد","d":"فرد حقیقی که با سرمایه شخصی و حجم کم معامله می‌کند.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"Institutional Investor","fa":"سرمایه‌گذار نهادی","d":"نهادهایی مانند صندوق‌ها و بیمه‌ها که حجم بزرگی از سرمایه را مدیریت می‌کنند.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"Mark-to-Market","fa":"ارزش‌گذاری به قیمت روز","d":"بهروزرسانی ارزش موقعیت‌ها بر اساس آخرین قیمت بازار.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"Underlying Asset","fa":"دارایی پایه","d":"داراییای که ارزش قرارداد مشتقه از آن مشتق می‌شود.","c":"مفاهیم پایه بازار و معاملات","n":false},{"en":"Securities","fa":"اوراق بهادار","d":"هر ورقه قابل معامله‌ای که حق مالکیت یا طلب را نشان می‌دهد؛ مانند سهام، اوراق قرضه و صکوک.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Natural Person","fa":"شخص حقیقی","d":"سرمایه‌گذار فردی؛ در بورس تهران «ورود و خروج پول حقیقی» از شاخص‌های پرطرفدار رفتار بازار است.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Legal Person","fa":"شخص حقوقی","d":"سرمایه‌گذار در قالب شرکت، صندوق یا نهاد؛ در مقابل شخص حقیقی.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Quote-Driven Market","fa":"بازار مظنه‌محور","d":"بازاری که قیمت‌ها را بازارگردان‌ها اعلام می‌کنند؛ رایج در بازار اوراق بدهی و ارز.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Order-Driven Market","fa":"بازار سفارش‌محور","d":"بازاری که قیمت از تطبیق سفارش‌های خرید و فروش معامله‌گران شکل می‌گیرد؛ مانند بازار سهام.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"ISIN Code","fa":"شناسه بین‌المللی اوراق بهادار (ISIN)","d":"کد ۱۲ کاراکتری یکتای هر ورقه بهادار که دو حرف اول آن نشان‌دهنده کشور ناشر است.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Securities Lending","fa":"قرض‌دهی اوراق بهادار","d":"قرض دادن موقت سهام یا اوراق در ازای کارمزد و وثیقه؛ پیش‌نیاز فروش استقراضی.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Prospectus","fa":"امیدنامه (بیانیه ثبت)","d":"سند رسمی عرضه اوراق که اطلاعات ناشر، طرح، ریسک‌ها و شرایط عرضه را افشا می‌کند.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Private Placement","fa":"عرضه خصوصی","d":"فروش اوراق به گروه محدودی از سرمایه‌گذاران نهادی، بدون عرضه عمومی.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Dual Listing","fa":"پذیرش دوگانه","d":"درج سهام یک شرکت به‌طور هم‌زمان در دو بورس، معمولاً در دو کشور.","c":"مفاهیم پایه بازار و معاملات","n":true},{"en":"Commodity","fa":"کالا (کامودیتی)","d":"کالای پایه و استانداردشده مانند نفت، فلزات یا غلات که در بازارها معامله می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Hard Commodities","fa":"کالاهای سخت","d":"کالاهای استخراجی مانند نفت، گاز و فلزات.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Soft Commodities","fa":"کالاهای نرم","d":"محصولات کشاورزی مانند قهوه، شکر، کاکائو، پنبه و غلات.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Base Metals","fa":"فلزات پایه","d":"فلزات صنعتی غیرگرانبها مانند مس، آلومینیوم، روی و نیکل.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Precious Metals","fa":"فلزات گرانبها","d":"فلزات کمیاب با ارزش بالا مانند طلا، نقره، پلاتین و پالادیوم.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Energy Commodities","fa":"کالاهای انرژی","d":"نفت خام، گاز طبیعی، فرآورده‌های نفتی، زغالسنگ و برق.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Spot Price","fa":"قیمت نقدی (اسپات)","d":"قیمت تحویل فوری یک کالا در بازار نقد.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Spot Market","fa":"بازار نقد","d":"بازاری که کالا در آن برای تحویل فوری معامله می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Physical Market","fa":"بازار فیزیکی","d":"بازار معامله و تحویل واقعی کالا، در برابر بازار کاغذی و مشتقه.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Contango","fa":"کانتانگو","d":"وضعیتی که قیمت قراردادهای آتی بالاتر از قیمت نقدی است.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Backwardation","fa":"بکوارداسیون","d":"وضعیتی که قیمت قراردادهای آتی پایین‌تر از قیمت نقدی است؛ نشانه کمبود عرضه فوری.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Forward Curve","fa":"منحنی قیمت آتی","d":"نمودار قیمت قراردادهای آتی یک کالا در سررسیدهای مختلف.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Cost of Carry","fa":"هزینه نگهداری","d":"مجموع هزینه انبارداری، بیمه و تأمین مالی منهای بازده نگهداری کالا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Convenience Yield","fa":"بازده رفاهی","d":"منفعت ناشی از در اختیار داشتن فیزیکی کالا به جای قرارداد آتی.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Storage Cost","fa":"هزینه انبارداری","d":"هزینه نگهداری فیزیکی کالا تا زمان تحویل یا فروش.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Basis","fa":"بیس (مبنا)","d":"اختلاف میان قیمت نقدی کالا و قیمت قرارداد آتی آن.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Brent Crude","fa":"نفت برنت","d":"نفت شاخص دریای شمال و مرجع قیمت‌گذاری بخش بزرگی از نفت جهان.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"WTI (West Texas Intermediate)","fa":"نفت وست تگزاس اینترمدیت","d":"نفت شاخص آمریکا که قراردادهای آتی آن در نایمکس معامله می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"OPEC+","fa":"اوپک پلاس","d":"ائتلاف کشورهای عضو اوپک و تولیدکنندگان غیرعضو برای هماهنگی سطح تولید نفت.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Crack Spread","fa":"اسپرد پالایشی","d":"اختلاف قیمت فرآورده‌های نفتی و نفت خام؛ معیار حاشیه سود پالایشگاه.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Spark Spread","fa":"اسپرد نیروگاهی","d":"اختلاف قیمت برق و هزینه گاز مصرفی؛ معیار حاشیه سود نیروگاه گازی.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Crush Spread","fa":"اسپرد فرآوری سویا","d":"اختلاف ارزش روغن و کنجاله سویا با قیمت دانه سویا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Barrel (bbl)","fa":"بشکه","d":"واحد اندازه‌گیری نفت برابر ۴۲ گالن آمریکایی یا حدود ۱۵۹ لیتر.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Troy Ounce (oz t)","fa":"اونس تروا","d":"واحد وزن فلزات گرانبها برابر حدود ۳۱٫۱ گرم.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Metric Ton (t)","fa":"تن متریک","d":"واحد وزن برابر ۱۰۰۰ کیلوگرم؛ رایج در معاملات فلزات و محصولات کشاورزی.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"MMBtu","fa":"میلیون واحد حرارتی بریتانیا","d":"واحد رایج قیمت‌گذاری گاز طبیعی.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"LME (London Metal Exchange)","fa":"بورس فلزات لندن","d":"بزرگ‌ترین بورس جهانی معاملات فلزات پایه.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"COMEX","fa":"کامکس","d":"بخش فلزات گروه CME در نیویورک و مرجع معاملات آتی طلا، نقره و مس.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"NYMEX","fa":"نایمکس","d":"بورس کالای نیویورک و مرجع اصلی قراردادهای آتی انرژی.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"LBMA Gold Price","fa":"قیمت مرجع طلای لندن","d":"قیمت روزانه مرجع طلا که از طریق حراج الکترونیکی LBMA تعیین می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Bullion","fa":"شمش","d":"فلز گرانبها به شکل شمش یا سکه با خلوص بالا که بر اساس وزن ارزش‌گذاری می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Fineness (Purity)","fa":"عیار","d":"میزان خلوص فلز گرانبها، مانند ۹۹۹٫۹ برای طلای خالص.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Warehouse Receipt","fa":"گواهی سپرده کالایی","d":"سندی که مالکیت مقدار معینی کالای انبارشده در انبار مورد تأیید بورس را نشان می‌دهد.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Inventories (Stocks)","fa":"موجودی انبار","d":"مقدار کالای ذخیره‌شده در انبارهای بورس یا کشورها؛ شاخص مهم عرضه و تقاضا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Supply Deficit","fa":"کسری عرضه","d":"وضعیتی که تقاضای کالا از عرضه آن بیشتر است.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Supply Surplus","fa":"مازاد عرضه","d":"وضعیتی که عرضه کالا از تقاضای آن بیشتر است.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Commodity Supercycle","fa":"ابرچرخه کالایی","d":"دوره چندساله افزایش قیمت کالاها به دلیل رشد ساختاری تقاضا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"TC/RC (Treatment & Refining Charges)","fa":"هزینه عملیات ذوب و پالایش","d":"کارمزدی که ذوب‌کننده‌ها برای فرآوری کنسانتره مس دریافت می‌کنند؛ شاخص تنگی بازار کنسانتره.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Concentrate","fa":"کنسانتره","d":"ماده معدنی فرآوری‌شده با عیار بالاتر که برای ذوب و پالایش ارسال می‌شود.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Cathode","fa":"کاتد","d":"شکل نهایی فلز تصفیهشده، مانند کاتد مس با خلوص بالا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Physical Premium","fa":"پریمیوم فیزیکی","d":"مبلغ اضافه بر قیمت مرجع به دلیل کیفیت، محل تحویل یا شرایط بازار.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Discount","fa":"کسورات (دیسکانت)","d":"مبلغ کمتر از قیمت مرجع به دلیل کیفیت پایین‌تر یا شرایط بازار.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"FOB (Free on Board)","fa":"تحویل روی عرشه (فوب)","d":"شرط تحویلی که مسئولیت فروشنده با بارگیری کالا روی کشتی پایان می‌یابد.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"CIF (Cost, Insurance & Freight)","fa":"سیف","d":"شرط تحویلی که هزینه کالا، بیمه و حمل تا بندر مقصد بر عهده فروشنده است.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Incoterms","fa":"اینکوترمز","d":"مجموعه قواعد بین‌المللی تعیین مسئولیت خریدار و فروشنده در تجارت کالا.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Commodity Exchange","fa":"بورس کالا","d":"بازار سازمانیافته برای معامله نقدی و مشتقه کالاها.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Renewable Energy Certificate (REC)","fa":"گواهی انرژی تجدیدپذیر","d":"گواهی که تولید یک واحد برق از منابع تجدیدپذیر را تأیید می‌کند.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Carbon Credit","fa":"اعتبار کربن","d":"گواهی قابل معامله که حق انتشار یک تن دیاکسید کربن یا معادل آن را نشان می‌دهد.","c":"بازارهای کالایی (کامودیتی)","n":false},{"en":"Option","fa":"اختیار معامله (آپشن)","d":"قراردادی که به دارنده حق، و نه تعهد، خرید یا فروش دارایی پایه در قیمتی معین را می‌دهد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Call Option","fa":"اختیار خرید","d":"حق خرید دارایی پایه در قیمت اعمال، در سررسید یا تا پیش از آن.","c":"اختیار معامله (آپشن)","n":false},{"en":"Put Option","fa":"اختیار فروش","d":"حق فروش دارایی پایه در قیمت اعمال، در سررسید یا تا پیش از آن.","c":"اختیار معامله (آپشن)","n":false},{"en":"Strike Price (Exercise Price)","fa":"قیمت اعمال","d":"قیمتی که دارنده اختیار می‌تواند دارایی پایه را به آن بخرد یا بفروشد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Option Premium","fa":"پرمیوم (قیمت اختیار)","d":"مبلغی که خریدار اختیار به فروشنده آن می‌پردازد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Expiration Date","fa":"تاریخ سررسید","d":"آخرین روزی که اختیار معامله اعتبار دارد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Exercise","fa":"اعمال","d":"استفاده دارنده اختیار از حق خود برای خرید یا فروش دارایی پایه.","c":"اختیار معامله (آپشن)","n":false},{"en":"Assignment","fa":"تخصیص","d":"ملزم شدن فروشنده اختیار به ایفای تعهد پس از اعمال توسط خریدار.","c":"اختیار معامله (آپشن)","n":false},{"en":"Holder (Buyer)","fa":"دارنده (خریدار اختیار)","d":"طرفی که با پرداخت پرمیوم، حق اختیار را به دست می‌آورد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Writer (Seller)","fa":"فروشنده (صادرکننده اختیار)","d":"طرفی که با دریافت پرمیوم، تعهد ایفای قرارداد را می‌پذیرد.","c":"اختیار معامله (آپشن)","n":false},{"en":"European Option","fa":"اختیار اروپایی","d":"اختیاری که فقط در تاریخ سررسید قابل اعمال است.","c":"اختیار معامله (آپشن)","n":false},{"en":"American Option","fa":"اختیار آمریکایی","d":"اختیاری که در هر زمان تا سررسید قابل اعمال است.","c":"اختیار معامله (آپشن)","n":false},{"en":"Bermudan Option","fa":"اختیار برمودایی","d":"اختیاری که فقط در تاریخ‌های معینی پیش از سررسید قابل اعمال است.","c":"اختیار معامله (آپشن)","n":false},{"en":"In the Money (ITM)","fa":"در سود","d":"اختیاری که اعمال فوری آن ارزش ذاتی مثبت دارد.","c":"اختیار معامله (آپشن)","n":false},{"en":"At the Money (ATM)","fa":"در قیمت (بیتفاوت)","d":"اختیاری که قیمت اعمال آن تقریباً برابر قیمت جاری دارایی پایه است.","c":"اختیار معامله (آپشن)","n":false},{"en":"Out of the Money (OTM)","fa":"در زیان","d":"اختیاری که در حال حاضر ارزش ذاتی ندارد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Intrinsic Value","fa":"ارزش ذاتی","d":"سود حاصل از اعمال فوری اختیار؛ برای اختیار خرید برابر بیشینه صفر و اختلاف قیمت پایه با قیمت اعمال.","c":"اختیار معامله (آپشن)","n":false},{"en":"Time Value","fa":"ارزش زمانی","d":"بخشی از پرمیوم که فراتر از ارزش ذاتی است و با نزدیک شدن به سررسید کاهش می‌یابد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Moneyness","fa":"وضعیت سودآوری اختیار","d":"جایگاه قیمت دارایی پایه نسبت به قیمت اعمال (ATM، ITM یا OTM).","c":"اختیار معامله (آپشن)","n":false},{"en":"Contract Size","fa":"اندازه قرارداد","d":"تعداد واحدهای دارایی پایه در هر قرارداد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Open Interest","fa":"موقعیت‌های باز","d":"تعداد قراردادهایی که باز هستند و هنوز بسته یا تسویه نشدهاند.","c":"اختیار معامله (آپشن)","n":false},{"en":"Implied Volatility (IV)","fa":"نوسان ضمنی","d":"نوسانی که از قیمت بازاری اختیار استخراج می‌شود و انتظار بازار از نوسان آینده را نشان می‌دهد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Historical Volatility (HV)","fa":"نوسان تاریخی","d":"انحراف معیار بازده‌های گذشته دارایی پایه، معمولاً به صورت سالانه.","c":"اختیار معامله (آپشن)","n":false},{"en":"Volatility Smile","fa":"لبخند نوسان","d":"الگویی که در آن نوسان ضمنی قیمت‌های اعمال دور از قیمت جاری بالاتر است.","c":"اختیار معامله (آپشن)","n":false},{"en":"Volatility Skew","fa":"چولگی نوسان","d":"تفاوت نامتقارن نوسان ضمنی در قیمت‌های اعمال مختلف.","c":"اختیار معامله (آپشن)","n":false},{"en":"Black-Scholes Model","fa":"مدل بلک شولز","d":"مدل ریاضی مشهور برای قیمت‌گذاری اختیارهای اروپایی.","c":"اختیار معامله (آپشن)","n":false},{"en":"Binomial Model","fa":"مدل دوجمله‌ای","d":"مدل قیمت‌گذاری اختیار با فرض دو حالت افزایش یا کاهش قیمت در هر گام زمانی.","c":"اختیار معامله (آپشن)","n":false},{"en":"Put-Call Parity","fa":"برابری اختیار خرید و فروش","d":"رابطه‌ای که قیمت اختیار خرید و فروش اروپایی با قیمت اعمال و سررسید یکسان را به هم پیوند می‌دهد.","c":"اختیار معامله (آپشن)","n":false},{"en":"The Greeks","fa":"یونانی‌ها","d":"مجموعه سنجه‌هایی که حساسیت قیمت اختیار به عوامل مختلف را اندازه می‌گیرند.","c":"اختیار معامله (آپشن)","n":false},{"en":"Delta (Δ)","fa":"دلتا","d":"تغییر قیمت اختیار به ازای یک واحد تغییر در قیمت دارایی پایه.","c":"اختیار معامله (آپشن)","n":false},{"en":"Gamma (Γ)","fa":"گاما","d":"نرخ تغییر دلتا به ازای تغییر قیمت دارایی پایه.","c":"اختیار معامله (آپشن)","n":false},{"en":"Theta (Θ)","fa":"تتا","d":"کاهش ارزش اختیار با گذشت زمان، با فرض ثابت ماندن سایر عوامل.","c":"اختیار معامله (آپشن)","n":false},{"en":"Vega (ν)","fa":"وگا","d":"تغییر قیمت اختیار به ازای یک واحد درصد تغییر در نوسان ضمنی.","c":"اختیار معامله (آپشن)","n":false},{"en":"Rho (ρ)","fa":"رو","d":"تغییر قیمت اختیار به ازای تغییر نرخ بهره بدون ریسک.","c":"اختیار معامله (آپشن)","n":false},{"en":"Time Decay","fa":"فرسایش زمانی","d":"کاهش تدریجی ارزش زمانی اختیار با نزدیک شدن به سررسید.","c":"اختیار معامله (آپشن)","n":false},{"en":"Delta Hedging","fa":"پوشش دلتا","d":"تنظیم موقعیت در دارایی پایه برای خنثی کردن حساسیت سبد به تغییر قیمت.","c":"اختیار معامله (آپشن)","n":false},{"en":"Covered Call","fa":"اختیار خرید پوشش‌داده‌شده","d":"فروش اختیار خرید همراه با نگهداری دارایی پایه برای کسب درآمد از پرمیوم.","c":"اختیار معامله (آپشن)","n":false},{"en":"Protective Put","fa":"اختیار فروش حمایتی","d":"خرید اختیار فروش روی دارایی در اختیار برای محدود کردن زیان؛ مشابه بیمه سهام.","c":"اختیار معامله (آپشن)","n":false},{"en":"Married Put","fa":"اختیار فروش همراه","d":"خرید همزمان دارایی پایه و اختیار فروش روی آن.","c":"اختیار معامله (آپشن)","n":false},{"en":"Straddle","fa":"استرادل","d":"خرید همزمان اختیار خرید و فروش با قیمت اعمال و سررسید یکسان برای سود از نوسان شدید.","c":"اختیار معامله (آپشن)","n":false},{"en":"Strangle","fa":"استرنگل","d":"خرید اختیار خرید و فروش در زیان با قیمت‌های اعمال متفاوت؛ نسخه ارزان‌تر استرادل.","c":"اختیار معامله (آپشن)","n":false},{"en":"Bull Call Spread","fa":"اسپرد صعودی با اختیار خرید","d":"خرید اختیار خرید با قیمت اعمال پایین و فروش اختیار خرید با قیمت اعمال بالاتر.","c":"اختیار معامله (آپشن)","n":false},{"en":"Bear Put Spread","fa":"اسپرد نزولی با اختیار فروش","d":"خرید اختیار فروش با قیمت اعمال بالا و فروش اختیار فروش با قیمت اعمال پایین‌تر.","c":"اختیار معامله (آپشن)","n":false},{"en":"Butterfly Spread","fa":"راهبرد پروانه","d":"راهبرد سهقیمتی با بیشترین سود در صورت ماندن قیمت نزدیک قیمت اعمال میانی.","c":"اختیار معامله (آپشن)","n":false},{"en":"Iron Condor","fa":"کرکس آهنی","d":"ترکیب دو اسپرد اعتباری برای کسب سود در بازار کمنوسان و محدود.","c":"اختیار معامله (آپشن)","n":false},{"en":"Collar","fa":"راهبرد یقه","d":"خرید اختیار فروش و فروش اختیار خرید روی دارایی در اختیار برای محدود کردن سود و زیان.","c":"اختیار معامله (آپشن)","n":false},{"en":"Calendar Spread","fa":"اسپرد زمانی","d":"خرید و فروش اختیارهای همقیمت با سررسیدهای متفاوت.","c":"اختیار معامله (آپشن)","n":false},{"en":"Synthetic Position","fa":"موقعیت مصنوعی","d":"بازسازی بازده یک دارایی یا اختیار با ترکیب ابزارهای دیگر.","c":"اختیار معامله (آپشن)","n":false},{"en":"Breakeven Point","fa":"نقطه سربهسر","d":"قیمتی از دارایی پایه که در آن سود و زیان راهبرد صفر می‌شود.","c":"اختیار معامله (آپشن)","n":false},{"en":"Payoff Diagram","fa":"نمودار سود و زیان","d":"نمودار بازده یک موقعیت یا راهبرد در سررسید بر حسب قیمت دارایی پایه.","c":"اختیار معامله (آپشن)","n":false},{"en":"IV Crush","fa":"ریزش نوسان ضمنی","d":"افت شدید نوسان ضمنی پس از رویدادی مهم مانند انتشار گزارش سود.","c":"اختیار معامله (آپشن)","n":false},{"en":"Exotic Option","fa":"اختیار غیراستاندارد (اگزوتیک)","d":"اختیاری با ساختار پیچیده‌تر از اختیارهای عادی، مانند اختیار آسیایی یا مانعدار.","c":"اختیار معامله (آپشن)","n":false},{"en":"Asian Option","fa":"اختیار آسیایی","d":"اختیاری که بازده آن به میانگین قیمت دارایی پایه در یک دوره بستگی دارد.","c":"اختیار معامله (آپشن)","n":false},{"en":"Barrier Option","fa":"اختیار مانعدار","d":"اختیاری که با عبور قیمت از یک سطح معین فعال یا باطل می‌شود.","c":"اختیار معامله (آپشن)","n":false},{"en":"Binary (Digital) Option","fa":"اختیار دودویی","d":"اختیاری که در صورت تحقق شرط مبلغ ثابتی می‌پردازد و در غیر این صورت هیچ.","c":"اختیار معامله (آپشن)","n":false},{"en":"Warrant","fa":"ورانت","d":"اوراق اختیاری که ناشر منتشر می‌کند؛ اختیار فروش تبعی در بورس ایران نمونه‌ای از آن است.","c":"اختیار معامله (آپشن)","n":false},{"en":"Cash Settlement","fa":"تسویه نقدی","d":"تسویه قرارداد با پرداخت مابهالتفاوت به جای تحویل دارایی پایه.","c":"اختیار معامله (آپشن)","n":false},{"en":"Derivative","fa":"مشتقه","d":"ابزار مالی که ارزش آن از یک دارایی یا متغیر پایه مشتق می‌شود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Futures Contract","fa":"قرارداد آتی","d":"قرارداد استاندارد بورسی برای خرید یا فروش دارایی در تاریخ و قیمتی معین در آینده.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Forward Contract","fa":"قرارداد پیمان آتی","d":"قرارداد غیراستاندارد و خارج از بورس برای مبادله دارایی در آینده با قیمت توافقی.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Salam Contract","fa":"قرارداد سلف","d":"پیشخرید کالا با پرداخت کامل وجه در زمان حال و تحویل در آینده.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Standard Parallel Salam","fa":"سلف موازی استاندارد","d":"ابزار بورس انرژی و کالای ایران که امکان معامله ثانویه قرارداد سلف را فراهم می‌کند.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Physical Delivery","fa":"تحویل فیزیکی","d":"تسویه قرارداد با تحویل واقعی دارایی پایه.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Initial Margin","fa":"وجه تضمین اولیه","d":"مبلغی که هنگام باز کردن موقعیت آتی باید سپرده شود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Maintenance Margin","fa":"وجه تضمین لازم (نگهداری)","d":"حداقل موجودی حساب که باید برای باز ماندن موقعیت حفظ شود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Variation Margin","fa":"وجه تضمین متغیر","d":"مبلغ تسویه روزانه سود و زیان موقعیت‌های آتی.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Daily Settlement","fa":"تسویه روزانه","d":"محاسبه و تسویه سود و زیان موقعیت‌ها در پایان هر روز معاملاتی.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Settlement Price","fa":"قیمت تسویه","d":"قیمت مرجعی که بورس برای تسویه روزانه یا نهایی قرارداد تعیین می‌کند.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Delivery Month","fa":"ماه تحویل","d":"ماهی که قرارداد آتی در آن سررسید می‌شود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Front Month","fa":"قرارداد ماه نزدیک","d":"قرارداد آتی با نزدیک‌ترین سررسید که معمولاً بیشترین نقدشوندگی را دارد.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Rollover","fa":"تمدید موقعیت (رول)","d":"بستن قرارداد نزدیک و باز کردن قرارداد با سررسید دورتر.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Roll Yield","fa":"بازده رول","d":"سود یا زیان ناشی از جایگزینی قراردادهای آتی سررسیدشده با قراردادهای جدید.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Tick Size","fa":"حداقل تغییر قیمت","d":"کوچک‌ترین واحد مجاز تغییر قیمت یک قرارداد.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Convergence","fa":"همگرایی","d":"نزدیک شدن قیمت آتی به قیمت نقدی با نزدیک شدن سررسید.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Position Limit","fa":"حد مجاز موقعیت","d":"حداکثر تعداد قراردادی که یک معامله‌گر مجاز به نگهداری است.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Index Futures","fa":"قرارداد آتی شاخص","d":"قرارداد آتی که دارایی پایه آن یک شاخص بورسی است.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Perpetual Futures","fa":"قرارداد آتی دائمی","d":"قرارداد آتی بدون سررسید که با نرخ تأمین مالی به قیمت نقدی نزدیک نگه داشته می‌شود؛ رایج در بازار رمزارز.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Funding Rate","fa":"نرخ تأمین مالی","d":"پرداخت دوره‌ای میان خریداران و فروشندگان قراردادهای دائمی برای همگرایی با قیمت نقدی.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Swap","fa":"سوآپ (معاوضه)","d":"قراردادی برای مبادله جریان‌های نقدی آینده میان دو طرف.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Interest Rate Swap (IRS)","fa":"سوآپ نرخ بهره","d":"مبادله پرداخت‌های نرخ ثابت با نرخ شناور روی یک اصل مبلغ فرضی.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Currency Swap","fa":"سوآپ ارزی","d":"مبادله اصل و بهره در دو ارز مختلف میان دو طرف.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Commodity Swap","fa":"سوآپ کالایی","d":"مبادله قیمت ثابت با قیمت شناور یک کالا برای مدیریت ریسک قیمت.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Credit Default Swap (CDS)","fa":"سوآپ نکول اعتباری","d":"قراردادی که خریدار را در برابر نکول یک وام‌گیرنده یا ناشر بیمه می‌کند.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Total Return Swap (TRS)","fa":"سوآپ بازده کل","d":"مبادله بازده کل یک دارایی با پرداخت‌های مبتنی بر یک نرخ مرجع.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Notional Amount","fa":"اصل مبلغ فرضی","d":"مبلغ مرجعی که پرداخت‌های سوآپ بر اساس آن محاسبه می‌شود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Forward Rate Agreement (FRA)","fa":"قرارداد نرخ آتی","d":"قراردادی برای تثبیت نرخ بهره یک دوره در آینده.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Counterparty Risk","fa":"ریسک طرف مقابل","d":"احتمال ناتوانی طرف قرارداد در ایفای تعهدات خود.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Basis Risk","fa":"ریسک بیس","d":"ریسک ناشی از حرکت ناهمسان قیمت نقدی و قیمت ابزار پوشش‌دهنده.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Hedge Ratio","fa":"نسبت پوشش","d":"تعداد قراردادهای مشتقه لازم به ازای هر واحد دارایی در معرض ریسک.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Structured Product","fa":"محصول ساختاریافته","d":"ابزاری ترکیبی از اوراق و مشتقات با بازده و ریسک طراحی‌شده.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Embedded Derivative","fa":"مشتقه تعبیه‌شده","d":"جزء مشتقه‌ای که درون یک ابزار مالی دیگر مانند اوراق قابل تبدیل قرار دارد.","c":"آتی، پیمان آتی و سوآپ","n":false},{"en":"Central Bank","fa":"بانک مرکزی","d":"نهاد مسئول سیاست پولی، انتشار پول و نظارت بر نظام بانکی.","c":"پولی و بانکی","n":false},{"en":"Monetary Policy","fa":"سیاست پولی","d":"اقدامات بانک مرکزی برای کنترل نرخ بهره و حجم پول با هدف ثبات قیمت‌ها و رشد.","c":"پولی و بانکی","n":false},{"en":"Policy Rate","fa":"نرخ سیاستی","d":"نرخ بهره کلیدی که بانک مرکزی برای هدایت نرخ‌های بازار تعیین می‌کند.","c":"پولی و بانکی","n":false},{"en":"Federal Funds Rate","fa":"نرخ وجوه فدرال","d":"نرخ هدف وام‌دهی یکشبه میان بانک‌های آمریکا که فدرال رزرو تعیین می‌کند.","c":"پولی و بانکی","n":false},{"en":"FOMC","fa":"کمیته بازار باز فدرال","d":"کمیته تصمیم‌گیر فدرال رزرو درباره نرخ بهره و سیاست پولی آمریکا.","c":"پولی و بانکی","n":false},{"en":"Interbank Market","fa":"بازار بین‌بانکی","d":"بازاری که بانک‌ها در آن به یکدیگر وام کوتاه‌مدت می‌دهند.","c":"پولی و بانکی","n":false},{"en":"Interbank Rate","fa":"نرخ بین‌بانکی","d":"نرخ بهره وام‌های کوتاه‌مدت میان بانک‌ها.","c":"پولی و بانکی","n":false},{"en":"SOFR","fa":"سوفر","d":"نرخ تأمین مالی یکشبه با پشتوانه اوراق خزانه آمریکا؛ جایگزین لایبور.","c":"پولی و بانکی","n":false},{"en":"LIBOR","fa":"لایبور","d":"نرخ بهره بین‌بانکی لندن که تا پیش از کنار گذاشته شدن، مرجع جهانی قراردادها بود.","c":"پولی و بانکی","n":false},{"en":"Open Market Operations (OMO)","fa":"عملیات بازار باز","d":"خرید و فروش اوراق دولتی توسط بانک مرکزی برای تنظیم نقدینگی.","c":"پولی و بانکی","n":false},{"en":"Repo (Repurchase Agreement)","fa":"توافق بازخرید (ریپو)","d":"فروش اوراق با تعهد بازخرید در آینده؛ ابزار تأمین مالی کوتاه‌مدت.","c":"پولی و بانکی","n":false},{"en":"Reverse Repo","fa":"ریپوی معکوس","d":"خرید اوراق با تعهد فروش مجدد؛ ابزاری برای جذب نقدینگی.","c":"پولی و بانکی","n":false},{"en":"Reserve Requirement","fa":"نسبت سپرده قانونی","d":"درصدی از سپرده‌ها که بانک‌ها باید نزد بانک مرکزی نگهداری کنند.","c":"پولی و بانکی","n":false},{"en":"Quantitative Easing (QE)","fa":"تسهیل کمی","d":"خرید گسترده دارایی توسط بانک مرکزی برای افزایش نقدینگی و کاهش نرخ‌های بلندمدت.","c":"پولی و بانکی","n":false},{"en":"Quantitative Tightening (QT)","fa":"انقباض کمی","d":"کوچک کردن ترازنامه بانک مرکزی از طریق فروش یا تمدید نکردن اوراق.","c":"پولی و بانکی","n":false},{"en":"Money Supply","fa":"عرضه پول","d":"کل پول در گردش در اقتصاد در یک زمان معین.","c":"پولی و بانکی","n":false},{"en":"Monetary Base (M0)","fa":"پایه پولی","d":"اسکناس و مسکوک در گردش به همراه ذخایر بانک‌ها نزد بانک مرکزی.","c":"پولی و بانکی","n":false},{"en":"M1 (Narrow Money)","fa":"(M1)پول","d":"اسکناس و مسکوک در دست مردم به همراه سپرده‌های دیداری.","c":"پولی و بانکی","n":false},{"en":"M2 (Broad Money)","fa":"(M2)نقدینگی","d":"مجموع پول و شبهپول شامل سپرده‌های مدتدار و پسانداز.","c":"پولی و بانکی","n":false},{"en":"Money Multiplier","fa":"ضریب فزاینده پولی","d":"نسبت نقدینگی به پایه پولی؛ نشان‌دهنده توان خلق پول بانک‌ها.","c":"پولی و بانکی","n":false},{"en":"Inflation","fa":"تورم","d":"افزایش پایدار سطح عمومی قیمت‌ها و کاهش قدرت خرید پول.","c":"پولی و بانکی","n":false},{"en":"CPI (Consumer Price Index)","fa":"شاخص قیمت مصرف‌کننده","d":"سنجه تغییرات قیمت سبد کالاها و خدمات مصرفی خانوار.","c":"پولی و بانکی","n":false},{"en":"PPI (Producer Price Index)","fa":"شاخص قیمت تولیدکننده","d":"سنجه تغییرات قیمتی که تولیدکنندگان برای محصولات خود دریافت می‌کنند.","c":"پولی و بانکی","n":false},{"en":"Core Inflation","fa":"تورم هسته","d":"تورم بدون اقلام پرنوسان مانند غذا و انرژی.","c":"پولی و بانکی","n":false},{"en":"Deflation","fa":"تورم منفی (کاهش قیمت‌ها)","d":"کاهش پایدار سطح عمومی قیمت‌ها.","c":"پولی و بانکی","n":false},{"en":"Disinflation","fa":"کاهش نرخ تورم","d":"کند شدن سرعت افزایش قیمت‌ها در حالی که تورم همچنان مثبت است.","c":"پولی و بانکی","n":false},{"en":"Stagflation","fa":"رکود تورمی","d":"همزمانی تورم بالا با رکود اقتصادی و بیکاری.","c":"پولی و بانکی","n":false},{"en":"Hawkish","fa":"انقباضی (شاهینی)","d":"موضعی در سیاست پولی که به افزایش نرخ بهره برای مهار تورم تمایل دارد.","c":"پولی و بانکی","n":false},{"en":"Dovish","fa":"انبساطی (کبوتری)","d":"موضعی در سیاست پولی که به کاهش نرخ بهره برای حمایت از رشد تمایل دارد.","c":"پولی و بانکی","n":false},{"en":"Forward Guidance","fa":"هدایت انتظارات","d":"اعلام مسیر آتی سیاست پولی برای اثرگذاری بر انتظارات بازار.","c":"پولی و بانکی","n":false},{"en":"Lender of Last Resort","fa":"آخرین مرجع وام‌دهی","d":"نقش بانک مرکزی در تأمین نقدینگی بانک‌های دچار بحران.","c":"پولی و بانکی","n":false},{"en":"Nominal Interest Rate","fa":"نرخ بهره اسمی","d":"نرخ بهره اعلام‌شده بدون تعدیل بابت تورم.","c":"پولی و بانکی","n":false},{"en":"Real Interest Rate","fa":"نرخ بهره واقعی","d":"نرخ بهره اسمی منهای نرخ تورم.","c":"پولی و بانکی","n":false},{"en":"Capital Adequacy Ratio (CAR)","fa":"نسبت کفایت سرمایه","d":"نسبت سرمایه بانک به دارایی‌های موزون به ریسک؛ سنجه توان جذب زیان.","c":"پولی و بانکی","n":false},{"en":"Basel III","fa":"بازل ۳","d":"چارچوب بین‌المللی مقررات سرمایه، نقدینگی و اهرم بانک‌ها.","c":"پولی و بانکی","n":false},{"en":"Liquidity Coverage Ratio (LCR)","fa":"نسبت پوشش نقدینگی","d":"نسبت دارایی‌های نقد باکیفیت به خروجی‌های نقدی ۳۰ روزه در شرایط تنش.","c":"پولی و بانکی","n":false},{"en":"Non-Performing Loan (NPL)","fa":"مطالبات غیرجاری","d":"وام‌هایی که بازپرداخت آن‌ها برای مدت طولانی متوقف شده است.","c":"پولی و بانکی","n":false},{"en":"Loan-to-Deposit Ratio (LDR)","fa":"نسبت تسهیلات به سپرده","d":"نسبت وام‌های پرداختی بانک به سپرده‌های آن.","c":"پولی و بانکی","n":false},{"en":"Net Interest Margin (NIM)","fa":"حاشیه خالص بهره","d":"تفاوت درآمد و هزینه بهره بانک نسبت به دارایی‌های درآمدزا.","c":"پولی و بانکی","n":false},{"en":"Overdraft","fa":"اضافه برداشت","d":"برداشت بیش از موجودی حساب؛ در ایران به برداشت بانک‌ها از منابع بانک مرکزی هم گفته می‌شود.","c":"پولی و بانکی","n":false},{"en":"Deposit Insurance","fa":"بیمه سپرده","d":"تضمین سپرده‌های مشتریان تا سقف معین در صورت ورشکستگی بانک.","c":"پولی و بانکی","n":false},{"en":"Bank Run","fa":"هجوم بانکی","d":"برداشت همزمان و گسترده سپرده‌ها به دلیل نگرانی از توان پرداخت بانک.","c":"پولی و بانکی","n":false},{"en":"Credit Crunch","fa":"تنگنای اعتباری","d":"کاهش شدید دسترسی به وام و اعتبار در اقتصاد.","c":"پولی و بانکی","n":false},{"en":"Credit Rating","fa":"رتبه اعتباری","d":"ارزیابی توان بازپرداخت بدهی یک ناشر یا وام‌گیرنده توسط مؤسسه رتبه‌بندی.","c":"پولی و بانکی","n":false},{"en":"Letter of Credit (L/C)","fa":"اعتبار اسنادی","d":"تعهد بانک به پرداخت وجه به فروشنده در صورت ارائه اسناد مطابق شرایط.","c":"پولی و بانکی","n":false},{"en":"Bank Guarantee","fa":"ضمانت‌نامه بانکی","d":"تعهد بانک به پرداخت مبلغ معین در صورت عدم ایفای تعهد مشتری.","c":"پولی و بانکی","n":false},{"en":"SWIFT","fa":"سوئیفت","d":"شبکه بین‌المللی پیامرسانی مالی میان بانک‌ها.","c":"پولی و بانکی","n":false},{"en":"Shadow Banking","fa":"بانکداری سایه","d":"فعالیت‌های واسطه‌گری اعتباری خارج از نظام بانکی تحت نظارت.","c":"پولی و بانکی","n":false},{"en":"CBDC","fa":"پول دیجیتال بانک مرکزی","d":"شکل دیجیتال پول ملی که مستقیماً بانک مرکزی منتشر می‌کند.","c":"پولی و بانکی","n":false},{"en":"Islamic Banking","fa":"بانکداری اسلامی","d":"نظام بانکی مبتنی بر عقود شرعی و پرهیز از ربا.","c":"پولی و بانکی","n":false},{"en":"Mudarabah","fa":"مضاربه","d":"عقدی که یک طرف سرمایه و طرف دیگر کار را فراهم می‌کند و سود میان آن‌ها تقسیم می‌شود.","c":"پولی و بانکی","n":false},{"en":"Musharakah","fa":"مشارکت مدنی","d":"عقد شراکت در سرمایه برای انجام فعالیتی مشخص و تقسیم سود و زیان.","c":"پولی و بانکی","n":false},{"en":"Murabaha","fa":"مرابحه","d":"فروش کالا با افزودن سود معلوم به قیمت تمامشده؛ رایج در تسهیلات بانکی.","c":"پولی و بانکی","n":false},{"en":"Investment Banking","fa":"بانکداری سرمایه‌گذاری (تأمین سرمایه)","d":"خدمات تأمین مالی شرکت‌ها از بازار سرمایه، تعهد پذیره‌نویسی، ادغام و تملک و مشاوره مالی.","c":"پولی و بانکی","n":true},{"en":"Commercial Banking","fa":"بانکداری تجاری","d":"پذیرش سپرده و اعطای وام به خانوارها و بنگاه‌ها؛ هسته اصلی فعالیت بانک‌ها.","c":"پولی و بانکی","n":true},{"en":"Correspondent Banking","fa":"بانکداری کارگزاری (کارسپاندنت)","d":"رابطه‌ای که در آن یک بانک خدمات پرداخت و نقل‌وانتقال را برای بانکی در کشور دیگر انجام می‌دهد.","c":"پولی و بانکی","n":true},{"en":"Primary Dealer","fa":"معامله‌گر اصلی اوراق دولتی","d":"بانک یا نهادی که مجاز است مستقیماً با بانک مرکزی اوراق دولتی معامله کند و در حراج‌ها شرکت کند.","c":"پولی و بانکی","n":true},{"en":"Custodian Bank","fa":"بانک امین (کاستودین)","d":"نهادی که دارایی‌های صندوق‌ها و سرمایه‌گذاران را نگهداری و تسویه معاملات آن‌ها را انجام می‌دهد.","c":"پولی و بانکی","n":true},{"en":"Demand Deposit","fa":"سپرده دیداری (حساب جاری)","d":"سپرده‌ای که صاحب آن هر زمان بدون اطلاع قبلی می‌تواند برداشت کند.","c":"پولی و بانکی","n":true},{"en":"Collateral","fa":"وثیقه","d":"دارایی‌ای که وام‌گیرنده برای تضمین بازپرداخت در اختیار وام‌دهنده می‌گذارد.","c":"پولی و بانکی","n":true},{"en":"Haircut","fa":"کسر ارزش وثیقه (هیرکات)","d":"درصدی که از ارزش بازار وثیقه کم می‌شود تا وام‌دهنده در برابر افت قیمت آن محافظت شود.","c":"پولی و بانکی","n":true},{"en":"Secured Loan","fa":"وام با وثیقه","d":"وامی که با پشتوانه یک دارایی مشخص پرداخت می‌شود و در صورت نکول، وام‌دهنده حق تملک آن را دارد.","c":"پولی و بانکی","n":true},{"en":"Mortgage","fa":"وام رهنی (مسکن)","d":"وام بلندمدتی که ملک خریداری‌شده وثیقه آن است.","c":"پولی و بانکی","n":true},{"en":"Grace Period","fa":"دوره تنفس","d":"مدتی پس از دریافت وام که وام‌گیرنده هنوز ملزم به پرداخت قسط اصل نیست.","c":"پولی و بانکی","n":true},{"en":"Leasing","fa":"لیزینگ (اجاره به شرط تملیک)","d":"تأمین مالی دارایی از طریق اجاره، که در پایان دوره مالکیت به اجاره‌گیرنده منتقل می‌شود.","c":"پولی و بانکی","n":true},{"en":"Project Finance","fa":"تأمین مالی پروژه","d":"تأمین مالی بلندمدت یک پروژه که بازپرداخت آن به جریان نقد خود پروژه متکی است، نه ترازنامه حامیان آن.","c":"پولی و بانکی","n":true},{"en":"Bond","fa":"اوراق قرضه (اوراق بدهی)","d":"ابزار بدهی که ناشر آن متعهد به پرداخت سود دوره‌ای و اصل مبلغ در سررسید است.","c":"اوراق با درآمد ثابت","n":false},{"en":"Sukuk","fa":"صکوک","d":"اوراق بهادار اسلامی مبتنی بر دارایی که مالکیت مشاع در دارایی یا طرح را نشان می‌دهد.","c":"اوراق با درآمد ثابت","n":false},{"en":"Ijarah Sukuk","fa":"صکوک اجاره","d":"صکوکی که دارندگان آن مالک دارایی اجاره‌داده‌شده و ذینفع اجاره‌بهای آن هستند.","c":"اوراق با درآمد ثابت","n":false},{"en":"Murabaha Sukuk","fa":"صکوک مرابحه","d":"صکوکی که وجوه آن صرف خرید کالا و فروش اقساطی آن می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Islamic Treasury Bills","fa":"اسناد خزانه اسلامی (اخزا)","d":"اوراق بدون کوپن دولت ایران که زیر ارزش اسمی فروخته و در سررسید به ارزش اسمی بازپرداخت می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Face Value (Par)","fa":"ارزش اسمی","d":"مبلغی که ناشر در سررسید به دارنده اوراق می‌پردازد.","c":"اوراق با درآمد ثابت","n":false},{"en":"Coupon","fa":"کوپن (سود دوره‌ای)","d":"پرداخت دوره‌ای سود به دارنده اوراق.","c":"اوراق با درآمد ثابت","n":false},{"en":"Coupon Rate","fa":"نرخ کوپن","d":"نرخ سود سالانه اوراق نسبت به ارزش اسمی.","c":"اوراق با درآمد ثابت","n":false},{"en":"Zero-Coupon Bond","fa":"اوراق بدون کوپن","d":"اوراقی که سود دوره‌ای ندارد و زیر ارزش اسمی فروخته می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Maturity","fa":"سررسید","d":"تاریخی که اصل مبلغ اوراق بازپرداخت می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Yield","fa":"بازده","d":"درآمد سرمایه‌گذاری در اوراق به صورت درصدی از قیمت آن.","c":"اوراق با درآمد ثابت","n":false},{"en":"Yield to Maturity (YTM)","fa":"بازده تا سررسید","d":"نرخ بازده کل اوراق در صورت نگهداری تا سررسید؛ معادل نرخ بازده داخلی.","c":"اوراق با درآمد ثابت","n":false},{"en":"Current Yield","fa":"بازده جاری","d":"کوپن سالانه تقسیم بر قیمت فعلی اوراق.","c":"اوراق با درآمد ثابت","n":false},{"en":"Yield Curve","fa":"منحنی بازده","d":"نمودار بازده اوراق همکیفیت در سررسیدهای مختلف.","c":"اوراق با درآمد ثابت","n":false},{"en":"Inverted Yield Curve","fa":"منحنی بازده معکوس","d":"وضعیتی که بازده کوتاه‌مدت از بلندمدت بیشتر است؛ نشانه سنتی رکود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Term Structure of Interest Rates","fa":"ساختار زمانی نرخ بهره","d":"رابطه نرخ‌های بهره با سررسیدهای مختلف.","c":"اوراق با درآمد ثابت","n":false},{"en":"Duration","fa":"دیرش","d":"میانگین موزون زمان دریافت جریان‌های نقدی اوراق؛ سنجه حساسیت قیمت به نرخ بهره.","c":"اوراق با درآمد ثابت","n":false},{"en":"Modified Duration","fa":"دیرش تعدیل‌شده","d":"درصد تقریبی تغییر قیمت اوراق به ازای یک درصد تغییر در بازده.","c":"اوراق با درآمد ثابت","n":false},{"en":"Convexity","fa":"تحدب","d":"سنجه انحنای رابطه قیمت و بازده اوراق؛ مکمل دیرش.","c":"اوراق با درآمد ثابت","n":false},{"en":"Credit Spread","fa":"اسپرد اعتباری","d":"اختلاف بازده اوراق شرکتی با اوراق دولتی همسررسید؛ بیان‌گر ریسک اعتباری.","c":"اوراق با درآمد ثابت","n":false},{"en":"Default","fa":"نکول","d":"ناتوانی ناشر در پرداخت سود یا اصل بدهی در موعد مقرر.","c":"اوراق با درآمد ثابت","n":false},{"en":"Investment Grade","fa":"درجه سرمایه‌گذاری","d":"اوراقی با رتبه اعتباری BBB منفی یا بالاتر.","c":"اوراق با درآمد ثابت","n":false},{"en":"High-Yield (Junk) Bond","fa":"اوراق پرریسک (پربازده)","d":"اوراقی با رتبه اعتباری پایین‌تر از درجه سرمایه‌گذاری و بازده بالاتر.","c":"اوراق با درآمد ثابت","n":false},{"en":"Treasury Bill (T-Bill)","fa":"اسناد خزانه آمریکا","d":"اوراق کوتاه‌مدت دولت آمریکا با سررسید کمتر از یک سال.","c":"اوراق با درآمد ثابت","n":false},{"en":"Treasury Bond (T-Bond)","fa":"اوراق خزانه بلندمدت","d":"اوراق دولت آمریکا با سررسید ۲۰ یا ۳۰ سال.","c":"اوراق با درآمد ثابت","n":false},{"en":"TIPS","fa":"اوراق خزانه حمایت‌شده از تورم","d":"اوراق دولت آمریکا که اصل آن بر اساس تورم تعدیل می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Callable Bond","fa":"اوراق قابل بازخرید","d":"اوراقی که ناشر می‌تواند پیش از سررسید آن را بازخرید کند.","c":"اوراق با درآمد ثابت","n":false},{"en":"Convertible Bond","fa":"اوراق قابل تبدیل","d":"اوراقی که دارنده می‌تواند آن را به تعداد معینی سهام تبدیل کند.","c":"اوراق با درآمد ثابت","n":false},{"en":"Accrued Interest","fa":"سود تعلقگرفته","d":"سود انباشته از آخرین پرداخت کوپن تا تاریخ معامله.","c":"اوراق با درآمد ثابت","n":false},{"en":"Clean Price","fa":"قیمت تمیز","d":"قیمت اوراق بدون سود تعلقگرفته.","c":"اوراق با درآمد ثابت","n":false},{"en":"Dirty Price","fa":"قیمت کثیف (قیمت کامل)","d":"قیمت اوراق به همراه سود تعلقگرفته.","c":"اوراق با درآمد ثابت","n":false},{"en":"Discount Bond","fa":"اوراق زیر قیمت اسمی","d":"اوراقی که زیر ارزش اسمی معامله می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Premium Bond","fa":"اوراق بالای قیمت اسمی","d":"اوراقی که بالاتر از ارزش اسمی معامله می‌شود.","c":"اوراق با درآمد ثابت","n":false},{"en":"Issuer","fa":"ناشر","d":"نهادی که اوراق بهادار را منتشر و تعهدات آن را بر عهده می‌گیرد.","c":"اوراق با درآمد ثابت","n":false},{"en":"Underwriting","fa":"تعهد پذیرهنویسی","d":"تعهد نهاد مالی به خرید اوراق فروشنرفته در عرضه.","c":"اوراق با درآمد ثابت","n":false},{"en":"Covenant","fa":"تعهدات قراردادی","d":"شروطی که ناشر باید در طول عمر اوراق رعایت کند.","c":"اوراق با درآمد ثابت","n":false},{"en":"Basis Point (bp)","fa":"واحد پایه","d":"واحد رایج بیان تغییر نرخ‌ها؛ یکصدم درصد (۰٫۰۱٪).","c":"اوراق با درآمد ثابت","n":false},{"en":"Annuity","fa":"مستمری (اقساط ثابت)","d":"مجموعه‌ای از پرداخت‌های مساوی در فواصل زمانی منظم؛ پایه محاسبه اقساط وام و اوراق.","c":"اوراق با درآمد ثابت","n":true},{"en":"Compound Interest","fa":"بهره مرکب","d":"بهره‌ای که علاوه بر اصل، روی بهره‌های انباشته دوره‌های قبل هم محاسبه می‌شود.","c":"اوراق با درآمد ثابت","n":true},{"en":"Floating Rate Note (FRN)","fa":"اوراق با نرخ شناور","d":"اوراق قرضه‌ای که نرخ کوپن آن به‌طور دوره‌ای بر اساس یک نرخ مرجع به‌روز می‌شود.","c":"اوراق با درآمد ثابت","n":true},{"en":"Share (Stock)","fa":"سهم","d":"واحد مالکیت در یک شرکت.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Market Capitalization","fa":"ارزش بازار","d":"قیمت سهم ضربدر تعداد سهام منتشرشده.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Free Float","fa":"سهام شناور آزاد","d":"بخشی از سهام که آزادانه در بازار قابل معامله است.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Blue Chip","fa":"سهام بلوچیپ","d":"سهام شرکت‌های بزرگ، باثبات و معتبر.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Dividend","fa":"سود نقدی (سود تقسیمی)","d":"بخشی از سود شرکت که میان سهامداران توزیع می‌شود.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Dividend Yield","fa":"بازده سود نقدی","d":"سود نقدی سالانه هر سهم تقسیم بر قیمت سهم.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Payout Ratio","fa":"نسبت تقسیم سود","d":"درصدی از سود خالص که به صورت سود نقدی پرداخت می‌شود.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"EPS (Earnings per Share)","fa":"سود هر سهم","d":"سود خالص تقسیم بر تعداد سهام عادی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"P/E Ratio","fa":"نسبت قیمت به سود","d":"قیمت سهم تقسیم بر سود هر سهم؛ نشان می‌دهد بازار چند برابر سود را می‌پردازد.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"P/B Ratio","fa":"نسبت قیمت به ارزش دفتری","d":"قیمت سهم تقسیم بر ارزش دفتری هر سهم.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"P/S Ratio","fa":"نسبت قیمت به فروش","d":"ارزش بازار تقسیم بر فروش سالانه شرکت.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Enterprise Value (EV)","fa":"ارزش شرکت","d":"ارزش بازار سهام به علاوه خالص بدهی؛ ارزش کل کسبوکار.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"EBITDA","fa":"سود پیش از بهره، مالیات و استهلاک","d":"سنجه سودآوری عملیاتی بدون اثر ساختار سرمایه و استهلاک.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"EV/EBITDA","fa":"EBITDAنسبت ارزش شرکت به","d":"ضریب ارزش‌گذاری رایج برای مقایسه شرکت‌هایی با ساختار سرمایه متفاوت.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Discounted Cash Flow (DCF)","fa":"جریان نقدی تنزیل‌شده","d":"روش ارزش‌گذاری بر پایه ارزش فعلی جریان‌های نقدی آینده.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Free Cash Flow (FCF)","fa":"جریان نقدی آزاد","d":"جریان نقد عملیاتی منهای مخارج سرمایه‌ای.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"WACC","fa":"میانگین موزون هزینه سرمایه","d":"میانگین هزینه تأمین مالی از محل بدهی و حقوق صاحبان سهام.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Discount Rate","fa":"نرخ تنزیل","d":"نرخی که جریان‌های نقدی آینده با آن به ارزش فعلی تبدیل می‌شوند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Terminal Value","fa":"ارزش پایانی","d":"ارزش جریان‌های نقدی پس از دوره پیش‌بینی صریح در مدل DCF.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Net Present Value (NPV)","fa":"ارزش فعلی خالص","d":"ارزش فعلی جریان‌های ورودی منهای ارزش فعلی جریان‌های خروجی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Internal Rate of Return (IRR)","fa":"نرخ بازده داخلی","d":"نرخ تنزیلی که ارزش فعلی خالص را صفر می‌کند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"CAPM","fa":"مدل قیمت‌گذاری دارایی‌های سرمایه‌ای","d":"مدلی که بازده مورد انتظار را بر اساس نرخ بدون ریسک، بتا و صرف ریسک بازار تعیین می‌کند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Balance Sheet","fa":"ترازنامه (صورت وضعیت مالی)","d":"صورت داراییها، بدهی‌ها و حقوق صاحبان سهام در یک تاریخ معین.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Income Statement","fa":"صورت سود و زیان","d":"گزارش درآمدها، هزینه‌ها و سود یا زیان در یک دوره.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Cash Flow Statement","fa":"صورت جریان‌های نقدی","d":"گزارش ورود و خروج وجه نقد از فعالیت‌های عملیاتی، سرمایه‌گذاری و تأمین مالی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Revenue","fa":"درآمد عملیاتی (فروش)","d":"مبلغ حاصل از فروش کالا و خدمات در فعالیت اصلی شرکت.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Gross Margin","fa":"حاشیه سود ناخالص","d":"سود ناخالص تقسیم بر فروش.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Operating Margin","fa":"حاشیه سود عملیاتی","d":"سود عملیاتی تقسیم بر فروش.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Net Margin","fa":"حاشیه سود خالص","d":"سود خالص تقسیم بر فروش.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"ROE (Return on Equity)","fa":"بازده حقوق صاحبان سهام","d":"سود خالص تقسیم بر حقوق صاحبان سهام.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"ROA (Return on Assets)","fa":"بازده دارایی‌ها","d":"سود خالص تقسیم بر کل دارایی‌ها.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"CAPEX","fa":"مخارج سرمایه‌ای","d":"هزینه خرید یا ارتقای دارایی‌های ثابت.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Depreciation","fa":"استهلاک","d":"تخصیص بهای دارایی ثابت مشهود در طول عمر مفید آن.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Working Capital","fa":"سرمایه در گردش","d":"دارایی‌های جاری منهای بدهی‌های جاری.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Current Ratio","fa":"نسبت جاری","d":"دارایی‌های جاری تقسیم بر بدهی‌های جاری.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Debt-to-Equity Ratio","fa":"نسبت بدهی به حقوق صاحبان سهام","d":"سنجه میزان اتکای شرکت به تأمین مالی از محل بدهی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Book Value","fa":"ارزش دفتری","d":"ارزش حقوق صاحبان سهام بر اساس ترازنامه.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Rights Issue","fa":"افزایش سرمایه از محل آورده","d":"انتشار سهام جدید با حق تقدم خرید برای سهامداران فعلی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Stock Split","fa":"تجزیه سهام","d":"افزایش تعداد سهام و کاهش متناسب قیمت هر سهم بدون تغییر ارزش کل.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Share Buyback","fa":"بازخرید سهام","d":"خرید سهام شرکت توسط خود شرکت از بازار.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Guidance","fa":"پیش‌بینی مدیریت","d":"برآورد مدیریت شرکت از عملکرد مالی دوره‌های آینده.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Earnings Call","fa":"کنفرانس گزارش سود","d":"جلسه ارائه نتایج مالی شرکت به تحلیل‌گران و سرمایه‌گذاران.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"ETF (Exchange-Traded Fund)","fa":"صندوق قابل معامله","d":"صندوقی که واحدهای آن مانند سهام در بورس معامله می‌شود.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Mutual Fund","fa":"صندوق سرمایه‌گذاری مشترک","d":"صندوقی که منابع سرمایه‌گذاران را تجمیع و به صورت حرفه‌ای مدیریت می‌کند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"NAV (Net Asset Value)","fa":"خالص ارزش دارایی‌ها","d":"ارزش دارایی‌های صندوق منهای بدهیها، تقسیم بر تعداد واحدها.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Hedge Fund","fa":"صندوق پوشش ریسک","d":"صندوق خصوصی با راهبردهای متنوع شامل اهرم، فروش استقراضی و مشتقات.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":false},{"en":"Valuation","fa":"ارزش‌گذاری","d":"برآورد ارزش ذاتی یک دارایی یا شرکت با روش‌هایی مانند جریان نقد تنزیل‌شده یا مقایسه نسبت‌ها.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Hurdle Rate","fa":"نرخ بازده حداقلی (نرخ مانع)","d":"کمترین بازدهی که یک پروژه یا سرمایه‌گذاری باید داشته باشد تا پذیرفته شود.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Goodwill","fa":"سرقفلی","d":"مازاد بهای پرداختی برای خرید یک شرکت نسبت به ارزش منصفانه خالص دارایی‌های آن.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Intangible Assets","fa":"دارایی‌های نامشهود","d":"دارایی‌های بدون وجود فیزیکی مانند حق امتیاز، برند، نرم‌افزار و سرقفلی.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Amortization","fa":"استهلاک دارایی نامشهود","d":"تخصیص بهای دارایی نامشهود به هزینه در طول عمر مفید آن؛ همچنین بازپرداخت تدریجی اصل وام.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Retained Earnings","fa":"سود انباشته","d":"بخشی از سود سال‌های گذشته که میان سهامداران تقسیم نشده و در شرکت مانده است.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Accounts Receivable","fa":"حساب‌ها و اسناد دریافتنی","d":"مبالغی که مشتریان بابت فروش نسیه به شرکت بدهکارند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Accounts Payable","fa":"حساب‌ها و اسناد پرداختنی","d":"مبالغی که شرکت بابت خرید نسیه به تأمین‌کنندگان بدهکار است.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Consolidated Financial Statements","fa":"صورت‌های مالی تلفیقی","d":"صورت‌هایی که شرکت اصلی و شرکت‌های تابعه را مانند یک واحد اقتصادی گزارش می‌کنند.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Deferred Tax","fa":"مالیات انتقالی (معوق)","d":"مالیاتی که به‌دلیل تفاوت زمانی میان سود حسابداری و سود مشمول مالیات، در آینده پرداخت یا کسر می‌شود.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Provision","fa":"ذخیره","d":"بدهی‌ای با زمان یا مبلغ نامشخص که از محل سود شناسایی می‌شود؛ مانند ذخیره مطالبات مشکوک‌الوصول.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Registered Capital","fa":"سرمایه ثبتی","d":"سرمایه‌ای که در اساسنامه و مدارک ثبتی شرکت درج شده است؛ مبنای افزایش سرمایه در بورس تهران.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Treasury Stock","fa":"سهام خزانه","d":"سهامی که شرکت از بازار بازخرید کرده و نزد خود نگه می‌دارد؛ حق رأی و سود ندارد.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Preferred Stock","fa":"سهام ممتاز","d":"سهامی که در دریافت سود یا دارایی هنگام انحلال بر سهام عادی اولویت دارد.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Capital Gains","fa":"عایدی سرمایه‌ای","d":"سودی که از فروش دارایی به قیمتی بالاتر از قیمت خرید به دست می‌آید.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Private Equity","fa":"سرمایه‌گذاری خصوصی (پرایوت اکوئیتی)","d":"‌سرمایه‌گذاری در سهام شرکت‌هایی که در بورس عرضه نشده‌اند، معمولاً با هدف رشد و خروج سودآور.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Unicorn","fa":"یونیکورن (شرکت تک‌شاخ)","d":"شرکت نوپای خصوصی با ارزش‌گذاری یک میلیارد دلار یا بیشتر.","c":"سهام، ارزش‌گذاری و صورت‌های مالی","n":true},{"en":"Technical Analysis","fa":"تحلیل تکنیکال","d":"پیش‌بینی حرکت قیمت بر پایه داده‌های گذشته قیمت و حجم.","c":"تحلیل تکنیکال","n":false},{"en":"Fundamental Analysis","fa":"تحلیل بنیادی","d":"ارزیابی ارزش ذاتی دارایی بر پایه عوامل اقتصادی و مالی.","c":"تحلیل تکنیکال","n":false},{"en":"Candlestick","fa":"شمع ژاپنی (کندل)","d":"نمایش قیمت باز شدن، بسته شدن، بیشینه و کمینه در یک دوره.","c":"تحلیل تکنیکال","n":false},{"en":"Support","fa":"حمایت","d":"سطح قیمتی که تقاضا معمولاً مانع کاهش بیشتر قیمت می‌شود.","c":"تحلیل تکنیکال","n":false},{"en":"Resistance","fa":"مقاومت","d":"سطح قیمتی که عرضه معمولاً مانع افزایش بیشتر قیمت می‌شود.","c":"تحلیل تکنیکال","n":false},{"en":"Trend Line","fa":"خط روند","d":"خطی که کف‌ها یا سقف‌های متوالی قیمت را به هم وصل می‌کند.","c":"تحلیل تکنیکال","n":false},{"en":"Breakout","fa":"شکست","d":"عبور قیمت از سطح حمایت یا مقاومت، معمولاً همراه با حجم قابل توجه.","c":"تحلیل تکنیکال","n":false},{"en":"Gap","fa":"گپ (شکاف قیمتی)","d":"فاصله میان قیمت بسته شدن یک دوره و باز شدن دوره بعد که در آن معامله‌ای انجام نشده است.","c":"تحلیل تکنیکال","n":false},{"en":"Pullback","fa":"پولبک","d":"بازگشت موقت قیمت به سطح شکسته‌شده پیش از ادامه روند.","c":"تحلیل تکنیکال","n":false},{"en":"Correction","fa":"اصلاح","d":"افت ۱۰ درصدی یا بیشتر قیمت پس از یک دوره رشد.","c":"تحلیل تکنیکال","n":false},{"en":"Consolidation","fa":"تثبیت (حرکت خنثی)","d":"دوره حرکت محدود قیمت در یک دامنه پیش از حرکت بعدی.","c":"تحلیل تکنیکال","n":false},{"en":"Moving Average (MA)","fa":"میانگین متحرک","d":"میانگین قیمت در تعداد معینی دوره اخیر برای هموارسازی روند.","c":"تحلیل تکنیکال","n":false},{"en":"Exponential Moving Average (EMA)","fa":"میانگین متحرک نمایی","d":"میانگین متحرکی که به داده‌های جدیدتر وزن بیشتری می‌دهد.","c":"تحلیل تکنیکال","n":false},{"en":"RSI (Relative Strength Index)","fa":"شاخص قدرت نسبی","d":"نوسان‌نمای صفر تا ۱۰۰ برای سنجش شتاب قیمت و شناسایی اشباع خرید یا فروش.","c":"تحلیل تکنیکال","n":false},{"en":"MACD","fa":"مکدی","d":"اندیکاتور مبتنی بر اختلاف دو میانگین متحرک نمایی برای سنجش روند و شتاب.","c":"تحلیل تکنیکال","n":false},{"en":"Bollinger Bands","fa":"باندهای بولینگر","d":"باندهایی در فاصله دو انحراف معیار بالا و پایین میانگین متحرک.","c":"تحلیل تکنیکال","n":false},{"en":"ATR (Average True Range)","fa":"میانگین دامنه واقعی","d":"سنجه میانگین دامنه نوسان قیمت در دوره‌های اخیر.","c":"تحلیل تکنیکال","n":false},{"en":"Fibonacci Retracement","fa":"اصلاح فیبوناچی","d":"سطوح بازگشتی احتمالی بر پایه نسبت‌های فیبوناچی مانند ۳۸٫۲ و ۶۱٫۸ درصد.","c":"تحلیل تکنیکال","n":false},{"en":"Ichimoku Cloud","fa":"ابر ایچیموکو","d":"سیستم اندیکاتوری ژاپنی برای شناسایی روند، حمایت و مقاومت.","c":"تحلیل تکنیکال","n":false},{"en":"Elliott Wave","fa":"امواج الیوت","d":"نظریه‌ای که حرکت قیمت را در قالب پنج موج روند و سه موج اصلاحی توصیف می‌کند.","c":"تحلیل تکنیکال","n":false},{"en":"Overbought","fa":"اشباع خرید","d":"وضعیتی که قیمت سریع و زیاد رشد کرده و احتمال اصلاح وجود دارد.","c":"تحلیل تکنیکال","n":false},{"en":"Oversold","fa":"اشباع فروش","d":"وضعیتی که قیمت سریع و زیاد افت کرده و احتمال بازگشت وجود دارد.","c":"تحلیل تکنیکال","n":false},{"en":"Divergence","fa":"واگرایی","d":"ناهمخوانی جهت حرکت قیمت و یک اندیکاتور؛ هشدار احتمالی تغییر روند.","c":"تحلیل تکنیکال","n":false},{"en":"Momentum","fa":"مومنتوم (شتاب)","d":"سرعت و قدرت تغییرات قیمت.","c":"تحلیل تکنیکال","n":false},{"en":"Head and Shoulders","fa":"الگوی سر و شانه","d":"الگوی بازگشتی با سه قله که قله میانی از دو قله دیگر بلندتر است.","c":"تحلیل تکنیکال","n":false},{"en":"Double Top / Double Bottom","fa":"سقف دوقلو / کف دوقلو","d":"الگوهای بازگشتی با دو سقف یا دو کف تقریباً همسطح.","c":"تحلیل تکنیکال","n":false},{"en":"Volume Profile","fa":"پروفایل حجمی","d":"توزیع حجم معاملات در سطوح مختلف قیمت.","c":"تحلیل تکنیکال","n":false},{"en":"Risk","fa":"ریسک","d":"عدم اطمینان درباره بازده آینده و احتمال انحراف آن از انتظار.","c":"ریسک و مدیریت سبد","n":false},{"en":"Systematic Risk","fa":"ریسک سیستماتیک","d":"ریسک کل بازار که با تنوعبخشی حذف نمی‌شود.","c":"ریسک و مدیریت سبد","n":false},{"en":"Unsystematic Risk","fa":"ریسک غیرسیستماتیک","d":"ریسک خاص یک شرکت یا صنعت که با تنوعبخشی کاهش می‌یابد.","c":"ریسک و مدیریت سبد","n":false},{"en":"Market Risk","fa":"ریسک بازار","d":"ریسک زیان ناشی از تغییر قیمتها، نرخ‌های بهره و نرخ ارز.","c":"ریسک و مدیریت سبد","n":false},{"en":"Credit Risk","fa":"ریسک اعتباری","d":"ریسک ناتوانی وام‌گیرنده یا ناشر در ایفای تعهدات.","c":"ریسک و مدیریت سبد","n":false},{"en":"Liquidity Risk","fa":"ریسک نقدشوندگی","d":"ریسک ناتوانی در فروش دارایی بدون زیان قابل توجه.","c":"ریسک و مدیریت سبد","n":false},{"en":"Operational Risk","fa":"ریسک عملیاتی","d":"ریسک زیان ناشی از خطای انسانی، سیستم‌ها یا فرایندها.","c":"ریسک و مدیریت سبد","n":false},{"en":"Tail Risk","fa":"ریسک دنباله","d":"ریسک رویدادهای نادر با اثر بسیار شدید.","c":"ریسک و مدیریت سبد","n":false},{"en":"Black Swan","fa":"قوی سیاه","d":"رویداد بسیار نامحتمل و پیش‌بینیناپذیر با پیامدهای گسترده.","c":"ریسک و مدیریت سبد","n":false},{"en":"Diversification","fa":"تنوعبخشی","d":"پخش سرمایه میان دارایی‌های مختلف برای کاهش ریسک.","c":"ریسک و مدیریت سبد","n":false},{"en":"Beta (β)","fa":"بتا","d":"حساسیت بازده دارایی به بازده بازار.","c":"ریسک و مدیریت سبد","n":false},{"en":"Alpha (α)","fa":"آلفا","d":"بازده مازاد سرمایه‌گذاری نسبت به بازده مورد انتظار یا شاخص مبنا.","c":"ریسک و مدیریت سبد","n":false},{"en":"Standard Deviation (σ)","fa":"انحراف معیار","d":"سنجه آماری پراکندگی بازدهها؛ رایج‌ترین معیار ریسک.","c":"ریسک و مدیریت سبد","n":false},{"en":"Correlation","fa":"همبستگی","d":"سنجه همجهتی حرکت دو دارایی در بازه منفی یک تا مثبت یک.","c":"ریسک و مدیریت سبد","n":false},{"en":"Covariance","fa":"کوواریانس","d":"سنجه تغییرات همزمان بازده دو دارایی.","c":"ریسک و مدیریت سبد","n":false},{"en":"Sharpe Ratio","fa":"نسبت شارپ","d":"بازده مازاد بر نرخ بدون ریسک تقسیم بر انحراف معیار.","c":"ریسک و مدیریت سبد","n":false},{"en":"Sortino Ratio","fa":"نسبت سورتینو","d":"مشابه نسبت شارپ، اما فقط با در نظر گرفتن نوسانات منفی.","c":"ریسک و مدیریت سبد","n":false},{"en":"Treynor Ratio","fa":"نسبت ترینر","d":"بازده مازاد بر نرخ بدون ریسک تقسیم بر بتا.","c":"ریسک و مدیریت سبد","n":false},{"en":"Value at Risk (VaR)","fa":"ارزش در معرض ریسک","d":"بیشینه زیان مورد انتظار در افق زمانی و سطح اطمینان معین.","c":"ریسک و مدیریت سبد","n":false},{"en":"Expected Shortfall (CVaR)","fa":"ریزش مورد انتظار","d":"میانگین زیان در بدترین حالت‌های فراتر از VaR.","c":"ریسک و مدیریت سبد","n":false},{"en":"Drawdown","fa":"افت سرمایه","d":"کاهش ارزش سبد از اوج تا کف.","c":"ریسک و مدیریت سبد","n":false},{"en":"Maximum Drawdown (MDD)","fa":"بیشینه افت سرمایه","d":"بزرگ‌ترین افت از اوج تا کف در یک دوره.","c":"ریسک و مدیریت سبد","n":false},{"en":"Stress Testing","fa":"آزمون تنش","d":"بررسی عملکرد سبد یا بانک در سناریوهای شدید و نامطلوب.","c":"ریسک و مدیریت سبد","n":false},{"en":"Monte Carlo Simulation","fa":"شبیه‌سازی مونت کارلو","d":"تولید هزاران سناریوی تصادفی برای برآورد توزیع نتایج ممکن.","c":"ریسک و مدیریت سبد","n":false},{"en":"Risk-Free Rate","fa":"نرخ بدون ریسک","d":"بازده دارایی بدون ریسک نکول؛ معمولاً بازده اوراق دولتی کوتاه‌مدت.","c":"ریسک و مدیریت سبد","n":false},{"en":"Risk Premium","fa":"صرف ریسک","d":"بازده اضافه‌ای که سرمایه‌گذار برای پذیرش ریسک انتظار دارد.","c":"ریسک و مدیریت سبد","n":false},{"en":"Efficient Frontier","fa":"مرز کارا","d":"مجموعه سبدهایی با بیشترین بازده مورد انتظار در هر سطح ریسک.","c":"ریسک و مدیریت سبد","n":false},{"en":"Modern Portfolio Theory (MPT)","fa":"نظریه مدرن پرتفوی","d":"چارچوب مارکوویتز برای انتخاب سبد بهینه بر پایه بازده و ریسک.","c":"ریسک و مدیریت سبد","n":false},{"en":"Asset Allocation","fa":"تخصیص دارایی","d":"تقسیم سرمایه میان طبقات مختلف دارایی.","c":"ریسک و مدیریت سبد","n":false},{"en":"Rebalancing","fa":"تعادلبخشی مجدد","d":"بازگرداندن وزن دارایی‌های سبد به اوزان هدف.","c":"ریسک و مدیریت سبد","n":false},{"en":"Assets Under Management (AUM)","fa":"دارایی تحت مدیریت","d":"کل ارزش بازار دارایی‌هایی که یک صندوق یا مدیر از طرف سرمایه‌گذاران مدیریت می‌کند.","c":"ریسک و مدیریت سبد","n":true},{"en":"Investment Policy Statement (IPS)","fa":"بیانیه سیاست سرمایه‌گذاری","d":"سندی که هدف، ریسک‌پذیری، افق زمانی و قواعد مدیریت سبد را مکتوب می‌کند.","c":"ریسک و مدیریت سبد","n":true},{"en":"Pension Fund","fa":"صندوق بازنشستگی","d":"نهادی که کسورات بازنشستگی را برای پرداخت مستمری آینده سرمایه‌گذاری می‌کند.","c":"ریسک و مدیریت سبد","n":true},{"en":"Exchange Rate","fa":"نرخ ارز","d":"قیمت یک واحد پول بر حسب پول دیگر.","c":"ارز و اقتصاد کلان","n":false},{"en":"Currency Pair","fa":"جفتارز","d":"نمایش نرخ مبادله دو ارز، مانند EUR/USD.","c":"ارز و اقتصاد کلان","n":false},{"en":"Base Currency","fa":"ارز پایه","d":"ارز اول در جفتارز.","c":"ارز و اقتصاد کلان","n":false},{"en":"Quote Currency","fa":"ارز مظنه","d":"ارز دوم در جفتارز که قیمت بر حسب آن بیان می‌شود.","c":"ارز و اقتصاد کلان","n":false},{"en":"Pip","fa":"پیپ","d":"کوچک‌ترین واحد رایج تغییر نرخ در بازار فارکس.","c":"ارز و اقتصاد کلان","n":false},{"en":"Appreciation","fa":"تقویت ارزش پول","d":"افزایش ارزش یک پول نسبت به پول‌های دیگر.","c":"ارز و اقتصاد کلان","n":false},{"en":"Currency Depreciation","fa":"تضعیف ارزش پول","d":"کاهش ارزش یک پول در نظام ارزی شناور.","c":"ارز و اقتصاد کلان","n":false},{"en":"Devaluation","fa":"کاهش رسمی ارزش پول","d":"کاهش عمدی ارزش پول ملی توسط دولت در نظام ارزی ثابت.","c":"ارز و اقتصاد کلان","n":false},{"en":"Fixed Exchange Rate","fa":"نظام ارزی ثابت","d":"نظامی که دولت نرخ ارز را در سطح معینی تثبیت می‌کند.","c":"ارز و اقتصاد کلان","n":false},{"en":"Floating Exchange Rate","fa":"نظام ارزی شناور","d":"نظامی که نرخ ارز با عرضه و تقاضا تعیین می‌شود.","c":"ارز و اقتصاد کلان","n":false},{"en":"Managed Float","fa":"شناور مدیریت‌شده","d":"نظام ارزی شناور با مداخله گاهبهگاه بانک مرکزی.","c":"ارز و اقتصاد کلان","n":false},{"en":"Carry Trade","fa":"معامله کری","d":"قرض گرفتن در ارز کمبهره و سرمایه‌گذاری در ارز پربهره.","c":"ارز و اقتصاد کلان","n":false},{"en":"Purchasing Power Parity (PPP)","fa":"برابری قدرت خرید","d":"نظریه‌ای که نرخ ارز تعادلی را بر پایه نسبت سطح قیمت‌ها تعیین می‌کند.","c":"ارز و اقتصاد کلان","n":false},{"en":"Interest Rate Parity","fa":"برابری نرخ بهره","d":"رابطه نرخ آتی و نقدی ارز با اختلاف نرخ بهره دو کشور.","c":"ارز و اقتصاد کلان","n":false},{"en":"Dollar Index (DXY)","fa":"شاخص دلار","d":"سنجه ارزش دلار آمریکا در برابر سبدی از شش ارز اصلی.","c":"ارز و اقتصاد کلان","n":false},{"en":"Foreign Exchange Reserves","fa":"ذخایر ارزی","d":"دارایی‌های خارجی در اختیار بانک مرکزی.","c":"ارز و اقتصاد کلان","n":false},{"en":"Balance of Payments","fa":"تراز پرداخت‌ها","d":"ثبت تمام مبادلات اقتصادی یک کشور با سایر کشورها.","c":"ارز و اقتصاد کلان","n":false},{"en":"Current Account","fa":"حساب جاری","d":"بخشی از تراز پرداخت‌ها شامل تجارت کالا و خدمات و درآمدها.","c":"ارز و اقتصاد کلان","n":false},{"en":"Trade Balance","fa":"تراز تجاری","d":"صادرات منهای واردات کالا.","c":"ارز و اقتصاد کلان","n":false},{"en":"GDP","fa":"تولید ناخالص داخلی","d":"ارزش بازاری کل کالاها و خدمات نهایی تولیدشده در یک کشور طی یک دوره.","c":"ارز و اقتصاد کلان","n":false},{"en":"Recession","fa":"رکود","d":"کاهش گسترده فعالیت اقتصادی؛ معمولاً دو فصل متوالی رشد منفی تولید.","c":"ارز و اقتصاد کلان","n":false},{"en":"Business Cycle","fa":"چرخه تجاری","d":"نوسانات دوره‌ای فعالیت اقتصادی میان رونق و رکود.","c":"ارز و اقتصاد کلان","n":false},{"en":"PMI (Purchasing Managers' Index)","fa":"شاخص مدیران خرید","d":"شاخص پیمایشی فعالیت بخش تولید و خدمات؛ عدد بالای ۵۰ نشانه رونق است.","c":"ارز و اقتصاد کلان","n":false},{"en":"Unemployment Rate","fa":"نرخ بیکاری","d":"درصد افراد جویای کار در جمعیت فعال که شاغل نیستند.","c":"ارز و اقتصاد کلان","n":false},{"en":"Nonfarm Payrolls (NFP)","fa":"اشتغال بخش غیرکشاورزی","d":"گزارش ماهانه تغییر شمار شاغلان آمریکا به جز بخش کشاورزی؛ از مهم‌ترین داده‌های اقتصادی.","c":"ارز و اقتصاد کلان","n":false},{"en":"Fiscal Policy","fa":"سیاست مالی","d":"تصمیمات دولت درباره مخارج و مالیات‌ها برای اثرگذاری بر اقتصاد.","c":"ارز و اقتصاد کلان","n":false},{"en":"Budget Deficit","fa":"کسری بودجه","d":"بیشتر بودن مخارج دولت از درآمدهای آن.","c":"ارز و اقتصاد کلان","n":false},{"en":"Sovereign Debt","fa":"بدهی دولتی","d":"بدهی منتشرشده یا تضمین‌شده توسط دولت.","c":"ارز و اقتصاد کلان","n":false},{"en":"Safe Haven","fa":"دارایی امن","d":"دارایی که در دوره‌های بحران ارزش خود را حفظ می‌کند یا افزایش می‌دهد، مانند طلا.","c":"ارز و اقتصاد کلان","n":false},{"en":"Risk-On / Risk-Off","fa":"ریسک‌پذیری / ریسکگریزی","d":"تغییر تمایل جمعی بازار میان دارایی‌های پرریسک و دارایی‌های امن.","c":"ارز و اقتصاد کلان","n":false},{"en":"Sanctions","fa":"تحریم","d":"محدودیت‌های اقتصادی و مالی که کشورها علیه یکدیگر اعمال می‌کنند.","c":"ارز و اقتصاد کلان","n":false},{"en":"Forex (FX)","fa":"بازار ارز (فارکس)","d":"بازار جهانی و خارج از بورس مبادله ارزها؛ بزرگ‌ترین بازار مالی دنیا از نظر حجم معاملات.","c":"ارز و اقتصاد کلان","n":true},{"en":"Foreign Direct Investment (FDI)","fa":"سرمایه‌گذاری مستقیم خارجی","d":"سرمایه‌گذاری خارجی با هدف مالکیت و نفوذ مؤثر در یک بنگاه، نه صرفاً خرید اوراق.","c":"ارز و اقتصاد کلان","n":true},{"en":"Purchasing Power","fa":"قدرت خرید","d":"مقدار کالا و خدماتی که با یک واحد پول می‌توان خرید؛ با تورم کاهش می‌یابد.","c":"ارز و اقتصاد کلان","n":true},{"en":"Public Joint Stock Company","fa":"شرکت سهامی عام","d":"شرکتی که سرمایه آن به سهام تقسیم شده و می‌تواند سهامش را به عموم عرضه کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Limited Liability Company (LLC)","fa":"شرکت با مسئولیت محدود","d":"شرکتی که مسئولیت هر شریک به میزان آورده او محدود است.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Subsidiary","fa":"شرکت فرعی (تابعه)","d":"شرکتی که بیش از نیمی از سهام یا کنترل آن در اختیار شرکت دیگری است.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Affiliated Company","fa":"شرکت وابسته","d":"شرکتی که شرکت دیگر در آن نفوذ قابل ملاحظه دارد، بدون آنکه کنترلش کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Special Purpose Vehicle (SPV)","fa":"شرکت با مقصود خاص","d":"شرکتی که فقط برای یک پروژه یا انتشار اوراق مشخص تأسیس می‌شود تا ریسک آن از بانی جدا بماند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Joint Venture","fa":"سرمایه‌گذاری مشترک","d":"همکاری دو یا چند شرکت در یک کسب‌وکار مشخص با سهیم شدن در سرمایه، سود و ریسک.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Merger & Acquisition (M&A)","fa":"ادغام و تملک","d":"ترکیب دو شرکت در یک شرکت (ادغام) یا خرید کنترل یک شرکت توسط دیگری (تملک).","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Spin-off","fa":"تجزیه (جداسازی)","d":"جدا کردن بخشی از کسب‌وکار یک شرکت و تبدیل آن به شرکتی مستقل.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Board of Directors","fa":"هیئت‌مدیره","d":"گروهی که مجمع انتخاب می‌کند تا شرکت را اداره کنند و بر مدیران نظارت داشته باشند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"General Meeting","fa":"مجمع عمومی","d":"نشست سهامداران برای تصویب صورت‌های مالی، تقسیم سود و انتخاب هیئت‌مدیره.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Articles of Association","fa":"اساسنامه","d":"سندی که قواعد اداره شرکت، اختیارات ارکان و حقوق سهامداران را تعیین می‌کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Shareholder Agreement (SHA)","fa":"توافق‌نامه سهامداران","d":"قرارداد میان سهامداران درباره اداره شرکت، انتقال سهام و حل اختلاف.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Pre-emption Right","fa":"حق تقدم","d":"حق سهامداران فعلی برای خرید سهام جدید پیش از دیگران در افزایش سرمایه.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Right of First Refusal","fa":"حق اولویت خرید","d":"‌حق سهامداران برای خرید سهامی که یک شریک قصد فروشش را دارد، پیش از اشخاص ثالث.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Corporate Governance","fa":"حاکمیت شرکتی","d":"مجموعه قواعد و سازوکارهایی که روابط مدیران، هیئت‌مدیره و سهامداران را تنظیم می‌کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Corporate Social Responsibility (CSR)","fa":"مسئولیت اجتماعی شرکت","d":"تعهد شرکت به پیامدهای اجتماعی و زیست‌محیطی فعالیتش، فراتر از سود.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Code of Conduct","fa":"منشور اخلاق حرفه‌ای","d":"اصول رفتاری که فعالان بازار سرمایه باید در برابر مشتریان و بازار رعایت کنند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Conflict of Interest","fa":"تعارض منافع","d":"وضعیتی که منافع شخصی یک فرد یا نهاد با وظیفه‌اش در برابر مشتری یا سهامدار در تضاد است.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Audit","fa":"حسابرسی","d":"بررسی مستقل صورت‌های مالی برای اظهارنظر درباره درستی و انطباق آن‌ها با استانداردها.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Disclosure","fa":"افشای اطلاعات","d":"انتشار به‌موقع اطلاعات بااهمیت ناشر برای همه سرمایه‌گذاران؛ در ایران از طریق سامانه کدال.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Material Non-Public Information (MNPI)","fa":"اطلاعات نهانی","d":"اطلاعات بااهمیتی که هنوز عمومی نشده و انتشارش می‌تواند قیمت را تغییر دهد.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Insider Trading","fa":"معامله با اطلاعات نهانی","d":"خرید یا فروش اوراق با استفاده از اطلاعات نهانی؛ تخلفی جرم‌انگاری‌شده در بیشتر بازارها.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Market Manipulation","fa":"دستکاری بازار","d":"ایجاد ظاهر گمراه‌کننده از قیمت یا حجم معاملات برای فریب دیگر معامله‌گران.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Related-Party Transactions","fa":"معاملات با اشخاص وابسته","d":"معاملاتی که شرکت با مدیران، سهامداران عمده یا شرکت‌های هم‌گروه خود انجام می‌دهد.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Compliance Officer","fa":"مسئول تطبیق مقررات","d":"فردی در نهاد مالی که بر رعایت قوانین و مقررات و سیاست‌های داخلی نظارت می‌کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Prudential Regulation","fa":"مقررات احتیاطی","d":"قواعدی که نهادهای مالی را به حفظ سرمایه و نقدینگی کافی برای کنترل ریسک ملزم می‌کند.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Deregulation","fa":"مقررات‌زدایی","d":"کاهش یا حذف محدودیت‌های قانونی بر فعالیت یک بازار یا صنعت.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Due Diligence","fa":"بررسی موشکافانه (دیودیلیجنس)","d":"بررسی جامع مالی، حقوقی و عملیاتی یک شرکت یا طرح پیش از سرمایه‌گذاری یا تملک.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true},{"en":"Bankruptcy","fa":"ورشکستگی","d":"وضعیت قانونی ناتوانی بنگاه یا شخص از پرداخت دیون، که به تصفیه یا تجدید ساختار می‌انجامد.","c":"حاکمیت شرکتی، مقررات و نظارت","n":true}];

const LANDS = [];
WORDS.forEach((w, i) => { let l = LANDS[LANDS.length - 1]; if (!l || l.name !== w.c) { l = { name: w.c, start: i, count: 0 }; LANDS.push(l); } l.count++; });
const LESSONS = [];
LANDS.forEach((l, li) => { l.lessons = []; for (let k = 0; k < l.count; k += PER) { const ids = []; for (let j = k; j < Math.min(k + PER, l.count); j++) ids.push(l.start + j); l.lessons.push(LESSONS.length); LESSONS.push({ land: li, ids }); } });
const landOfWord = i => LANDS.findIndex(l => i >= l.start && i < l.start + l.count);

  if (S.frozeNote < 0) return 'چند روز نیومدی و یه تخم تازه گذاشت. از نو شروع کن.';
  if (doneToday()) return `${nm} امروز خوشحاله. فردا ۴ کلمه‌ی تازه.`;
  return next ? `${fa(next - S.streak)} روز دیگه تا «${STAGES[stageOf(next)].name}»` : STAGES[st].sub;
}

/* ---------- render: map ---------- */
const STEP = 96;
function renderMap() {
  const cur = S.lessons;
  let html = '<div class="map">';
  LANDS.forEach((l, li) => {
    const [col, ic] = LAND_STYLE[li % LAND_STYLE.length];
    const doneHere = l.lessons.filter(x => x < cur).length;
    const locked = l.lessons[0] > cur;
    const nodes = l.lessons.length + 1; // + chest
    const h = nodes * STEP + 20;
    const xs = Array.from({ length: nodes }, (_, k) => 50 + Math.sin(k * 1.05 + li) * 26);
    const ys = Array.from({ length: nodes }, (_, k) => 46 + k * STEP);
    const px = xs.map(x => 100 - x);
    let d = `M ${px[0]} ${ys[0]}`;
    for (let k = 1; k < nodes; k++) { const my = (ys[k - 1] + ys[k]) / 2; d += ` C ${px[k - 1]} ${my}, ${px[k]} ${my}, ${px[k]} ${ys[k]}`; }
    let inner = '';
    l.lessons.forEach((L, k) => {
      let cls = 'lock', label = IC.lock;
      if (L < cur) { cls = 'done'; label = IC.check; }
      else if (L === cur) { cls = doneToday() ? 'wait' : 'cur'; label = doneToday() ? IC.moon : `<span class="num">${fa(L + 1)}</span>`; }
      inner += `<button type="button" class="node ${cls}" data-node="${L}" style="right:${xs[k]}%;top:${ys[k]}px" aria-label="درس ${fa(L + 1)}">${label}</button>`;
      if (L === cur) inner += `<span class="me-tag" style="right:${xs[k] + (xs[k] > 50 ? -22 : 22)}%;top:${ys[k] - 6}px">${petImg(stageOf(S.streak), moodNow())}</span>`;
    });
    const allDone = doneHere === l.lessons.length, open = S.chests.includes(li);
    inner += `<button type="button" class="node chest ${open ? 'open' : allDone ? 'ready' : ''}" data-chest="${li}" style="right:${xs[nodes - 1]}%;top:${ys[nodes - 1]}px" aria-label="صندوق گنج سرزمین ${fa(li + 1)}">${open ? IC.chestOpen : IC.chest}</button>`;
    html += `<section class="land ${locked ? 'locked' : ''}" style="--lc:${col}" id="land-${li}">
      <div class="land-head"><span class="land-ic">${LAND_IC[ic]}</span><div><b>سرزمین ${fa(li + 1)}: ${esc(LAND_SHORT[li] || l.name)}</b><small class="num">${fa(Math.min(l.count, Math.max(0, doneHere * PER)))} از ${fa(l.count)} واژه · ${fa(l.lessons.length)} ایستگاه</small></div></div>
      <div class="track" style="height:${h}px"><svg class="path" viewBox="0 0 100 ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${inner}</div>
    </section>`;
  });
  return html + '</div>';
}

function renderScreen() {
  const r = run; if (!r) return;
  let body = '';
  const pr = r.step === 'learn' ? (r.card / (r.ids.length + 1)) * 40 : r.step === 'quiz' ? 40 + (r.right / r.total) * 60 : 100;
  const head = `<div class="scr-head"><button type="button" class="x" id="close" aria-label="بستن">${IC.x}</button><div class="prog"><i style="width:${r.type === 'lesson' ? pr : r.step === 'done' ? 100 : (r.right / r.total) * 100}%"></i></div></div>`;
  if (r.step === 'learn') {
    const i = r.ids[r.card];
    body = `<div class="eyebrow">واژه‌ی ${fa(r.card + 1)} از ${fa(r.ids.length)}</div>${wordCard(i)}
      <div class="dots">${r.ids.map((_, k) => `<i class="${k === r.card ? 'on' : ''}"></i>`).join('')}</div>
      <div class="spacer"></div>
      <div class="row2">${r.card ? '<button class="btn ghost" type="button" id="prev">قبلی</button>' : ''}<button class="btn" type="button" id="next-card">${r.card < r.ids.length - 1 ? 'واژه‌ی بعد' : 'بریم سراغ سؤال‌ها'}</button></div>`;
  } else if (r.step === 'quiz') {
    const q = r.qs[r.at], a = r.answered;
    const opts = q.opts.map(o => { let c = ''; if (a) { if (o.i === q.idx) c = 'right'; else if (o.i === a.pick) c = 'wrong'; } return `<button type="button" class="opt ${c}" data-pick="${o.i}" ${a ? 'disabled' : ''}>${o.t}</button>`; }).join('');
    const lbl = r.type === 'chest' ? `آزمون صندوق گنج · ${fa(r.at + 1)} از ${fa(r.total)}` : r.type === 'review' ? 'مرور' : (r.ids && r.ids.includes(q.idx) ? 'واژه‌های امروز' : 'مرور واژه‌های قبلی');
    body = `<div class="eyebrow">${lbl}</div><div class="qtext">${q.prompt}</div>
      ${q.say && 'speechSynthesis' in window ? `<button type="button" class="link" data-say="${esc(q.say)}">🔊 بشنو</button>` : ''}
      <div class="opts">${opts}</div>
      ${a ? (a.ok ? `<div class="feedback ok">درسته! ${esc(WORDS[q.idx].en)} = ${esc(WORDS[q.idx].fa)}</div>` : `<div class="feedback no">جواب درست: «${esc(WORDS[q.idx].fa)}»${r.type !== 'chest' ? '. آخر کار دوباره می‌پرسمش.' : ''}</div>`) : ''}
      <div class="spacer"></div>${a ? `<button class="btn" type="button" id="next-q">ادامه</button>` : ''}`;
  } else {
    if (r.type === 'lesson') body = `<div class="done-hero"><div class="pet big mood-happy" style="width:220px">${petMedia(stageOf(S.streak), 'happy')}</div><div class="big num">${fa(S.streak)} روز</div><div>۴ واژه‌ی تازه یاد گرفتی و رفتن توی جعبه‌ی مرور.</div></div>
      <div class="stats3"><div><b class="num">${fa(learnedCount())}</b><small>واژه تا حالا</small></div><div><b class="num">${fa(r.total - r.mistakes)}/${fa(r.total)}</b><small>بار اول درست</small></div><div><b class="num">${fa(S.freezes)}</b><small>یخ‌زدگی</small></div></div>
      <div class="spacer"></div><button class="btn" type="button" id="close">برگرد به نقشه</button>`;
    else if (r.type === 'chest') body = `<div class="done-hero"><div class="chest-big" style="width:140px;height:140px;color:var(--gold)">${r.pass ? IC.chestOpen : IC.chest}</div><div class="big num">${fa(r.firstTry)} از ${fa(r.total)}</div><div>${r.pass ? 'صندوق باز شد! یه یخ‌زدگی جایزه گرفتی.' : 'برای باز کردن صندوق باید حداقل ۶ تا رو بار اول درست بزنی. یه کم مرور کن و دوباره بیا.'}</div></div><div class="spacer"></div><button class="btn" type="button" id="close">برگرد به نقشه</button>`;
    else body = `<div class="done-hero"><div class="big num">${fa(r.total - r.mistakes)} از ${fa(r.total)}</div><div>مرور امروز تموم شد. درست‌ها رفتن خونه‌ی بعد.</div></div><div class="spacer"></div><button class="btn" type="button" id="close">تموم</button>`;
  }

/* ---------- overlays ---------- */
function evolve(a, b) {
  const box = $('#evo');
  box.innerHTML = `<div class="evo-box"><div class="evo-pet"><div class="evo-stack"><div class="old">${petImg(a, 'normal')}</div><div class="neu">${petMedia(b, 'happy')}</div></div><div class="flash"></div></div>
