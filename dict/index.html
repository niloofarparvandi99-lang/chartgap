<style>
/* Layout: one phone-width column on deep graphite; a game map is the home, lessons open full screen, bottom tab bar.
   Deliberately single-theme (always dark graphite) so the dragon art and gold read as one luxury world. */
:root {
  --bg: #12161C; --bg-2: #171C23; --surface: #1C222A; --raised: #252C36; --line: #2F3844;
  --fg: #EEF1F5; --muted: #94A0AE; --dim: #6B7684;
  --gold: #E6B54A; --gold-2: #F7D98A; --gold-deep: #A9781A; --on-gold: #1A1408;
  --good: #3FD6A0; --good-soft: rgba(63,214,160,.13); --bad: #FF7A85; --bad-soft: rgba(255,122,133,.12); --ice: #8CC4FF;
  --font: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --r-lg: 22px; --r-md: 14px; --r-sm: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75; margin: 0; -webkit-tap-highlight-color: transparent }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 110px; display: flex; flex-direction: column; gap: 16px }
.lat { font-family: var(--serif); direction: ltr; unicode-bidi: isolate }
.num { font-variant-numeric: tabular-nums }
h2 { font-size: 1.12rem; margin: 0; font-weight: 900; text-wrap: balance }
.sec { display: flex; flex-direction: column; gap: 12px }
.sec > p { margin: 0; color: var(--muted); font-size: .88rem }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: linear-gradient(var(--bg) 75%, transparent); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px }
.back { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--fg) }
.back svg { width: 18px; height: 18px }
.back[hidden] { display: none }
.brand { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3 }
.brand b { font-size: 1.02rem; font-weight: 900; color: var(--gold-2) }
.brand small { color: var(--muted); font-size: .74rem }
.pills { display: flex; gap: 6px; flex: none }
.pill { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-size: .88rem }
.pill svg { width: 17px; height: 17px; flex: none }
.pill.fire { color: var(--gold) } .pill.off { color: var(--dim) } .pill.ice { color: var(--ice) }

/* hero: the dragon */
.hero { position: relative; border-radius: var(--r-lg); overflow: hidden; background: #1B2027; border: 1px solid var(--line); display: grid; grid-template-columns: 132px 1fr; gap: 14px; padding: 12px; align-items: center }
.pet { display: block; width: 132px; aspect-ratio: 1; border: 0; padding: 0; background: #1B2027; border-radius: 18px; overflow: hidden; cursor: pointer; transform-origin: 50% 100%; box-shadow: 0 10px 24px rgba(0,0,0,.4) }
.pet video, .pet img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none }
.pet.big { width: min(300px, 100%); border-radius: 26px; margin: 0 auto }
.pet.poke { animation: poke .5s cubic-bezier(.3,1.6,.5,1) }
.mood-normal img { animation: breathe 3.6s ease-in-out infinite } .mood-happy img { animation: hop 1.6s ease-in-out infinite }
.mood-sleepy img { animation: breathe 6s ease-in-out infinite } .mood-sad img { animation: sway 5s ease-in-out infinite } .mood-angry img { animation: fume 2.4s ease-in-out infinite }

@keyframes poke { 40% { transform: scale(.94, 1.05) } }
.hero-tx { min-width: 0; display: flex; flex-direction: column; gap: 6px }
.hero-tx .nm { font-weight: 900; color: var(--gold-2); font-size: 1.02rem; line-height: 1.4; display: flex; align-items: center; gap: 4px }
.hero-tx .st { font-size: .8rem; color: var(--muted); line-height: 1.6 }

.btn { border: 0; border-radius: var(--r-md); padding: 12px 16px; font-weight: 800; font-size: .98rem; background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--on-gold); width: 100%; box-shadow: 0 6px 18px rgba(230,181,74,.22); transition: transform .1s }
.btn:active { transform: scale(.98) }

.btn.sm { padding: 9px 12px; font-size: .9rem }

.pen { border: 0; background: none; padding: 2px; color: var(--dim); display: inline-grid; place-items: center }
.pen svg { width: 15px; height: 15px }
.link { border: 0; background: none; color: var(--gold); font-size: .82rem; font-weight: 800; padding: 0; align-self: flex-start }

/* map */
.map { position: relative; display: flex; flex-direction: column; gap: 0 }
.land { position: relative; border-radius: var(--r-lg); padding: 0 0 18px; margin-bottom: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--lc) 16%, transparent), color-mix(in srgb, var(--lc) 5%, transparent)); border: 1px solid color-mix(in srgb, var(--lc) 30%, var(--line)) }
.land-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 6px }
.land-ic { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--lc) 26%, var(--surface)); color: var(--lc); border: 1px solid color-mix(in srgb, var(--lc) 45%, transparent) }
.land-ic svg { width: 26px; height: 26px }
.land-head b { display: block; font-size: .95rem; line-height: 1.5 }
.land-head small { color: var(--muted); font-size: .76rem }
.land.locked .land-ic { filter: grayscale(1); opacity: .5 }
.track { position: relative; width: 100% }
.track svg.path { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
.node { position: absolute; transform: translate(50%, -50%); width: 62px; height: 62px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; font-weight: 900; font-size: 1rem }
.node.done { background: radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold) 60%, var(--gold-deep)); color: var(--on-gold); box-shadow: 0 5px 0 #6E4F10, 0 8px 18px rgba(0,0,0,.35) }
.node.cur { background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--lc) 70%, #fff) 45%, var(--lc)); color: #0E1218; box-shadow: 0 5px 0 color-mix(in srgb, var(--lc) 55%, #000), 0 0 0 6px color-mix(in srgb, var(--lc) 25%, transparent); animation: pulse 2s ease-in-out infinite }
.node.wait { background: color-mix(in srgb, var(--lc) 30%, var(--raised)); color: var(--fg); box-shadow: 0 5px 0 #0B0E12 }
.node.lock { background: var(--raised); color: var(--dim); box-shadow: 0 5px 0 #0B0E12 }
.node svg { width: 26px; height: 26px }
.node.chest { width: 74px; height: 74px; border-radius: 22px; background: linear-gradient(180deg, #3A2E1A, #241C10); box-shadow: 0 5px 0 #0B0E12; color: var(--gold) }
.node.chest.open { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--on-gold) }
.node.chest.ready { animation: pulse 1.6s ease-in-out infinite; box-shadow: 0 5px 0 #0B0E12, 0 0 0 6px rgba(230,181,74,.25) }
.node.chest svg { width: 40px; height: 40px }
@keyframes pulse { 50% { transform: translate(50%, -50%) scale(1.07) } }
.me-tag { position: absolute; width: 54px; height: 54px; border-radius: 14px; overflow: hidden; transform: translate(50%, -50%); border: 2px solid var(--gold); box-shadow: 0 6px 16px rgba(0,0,0,.45); pointer-events: none }
.me-tag img { width: 100%; height: 100%; object-fit: cover; display: block }

/* lesson screen */
.screen { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
.screen-in { max-width: 480px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; min-height: 100% }
.scr-head { display: flex; align-items: center; gap: 12px }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0 }
.x svg { width: 18px; height: 18px }
.prog { flex: 1; height: 10px; border-radius: 99px; background: var(--raised); overflow: hidden }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: 99px; transition: width .4s }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px }
.eyebrow { font-size: .76rem; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; background: var(--raised); color: var(--muted); font-size: .72rem; font-weight: 700 }
a.chip { text-decoration: none; color: var(--gold) }
.chip.new { background: var(--good-soft); color: var(--good) }
.word-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; direction: ltr }
.word-en { font-family: var(--serif); font-weight: 700; font-size: 1.9rem; line-height: 1.15; overflow-wrap: anywhere; color: var(--fg) }
.say { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); color: var(--gold); display: grid; place-items: center; padding: 0 }
.say svg { width: 20px; height: 20px }
.say.on { background: var(--gold); color: var(--on-gold) }
.word-fa { font-weight: 800; font-size: 1.25rem; color: var(--gold-2) }
.word-def { margin: 0; font-size: 1rem; max-width: 60ch }
.tool-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; font-size: .86rem; font-weight: 700 }
.tool-link span { flex: 1 }
.tool-link svg { width: 20px; height: 20px; color: var(--gold); flex: none }
.dots { display: flex; gap: 6px; justify-content: center }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--raised) }
.dots i.on { background: var(--gold); width: 22px; border-radius: 99px }
.row2 { display: flex; gap: 10px }
.row2 > * { flex: 1 }
.qtext { font-size: 1.02rem; font-weight: 700 }
.qtext .lat { font-size: 1.45rem; font-weight: 700; display: block; text-align: left; margin-top: 4px }
.qtext .def { display: block; font-weight: 500; margin-top: 6px; color: var(--fg) }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { text-align: right; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-md); padding: 11px 14px; font-weight: 600; line-height: 1.6; transition: border-color .15s, background .15s }
.opt:hover { border-color: var(--gold) }
.opt.right { border-color: var(--good); background: var(--good-soft) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s }
.opt[disabled] { cursor: default }
@keyframes shake { 25% { transform: translateX(-6px) } 50% { transform: translateX(5px) } 75% { transform: translateX(-3px) } }
.feedback { border-radius: var(--r-md); padding: 10px 14px; font-weight: 700; font-size: .92rem }
.feedback.ok { background: var(--good-soft); color: var(--good) } .feedback.no { background: var(--bad-soft); color: var(--bad) }
.spacer { flex: 1 }
.done-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px }
.done-hero .big { font-size: 2.4rem; font-weight: 900; color: var(--gold-2); line-height: 1.1 }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100% }
.stats3 div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 6px; text-align: center }
.stats3 b { display: block; font-size: 1.3rem; color: var(--gold-2) }
.stats3 small { color: var(--muted); font-size: .74rem }

/* search */
.search { position: relative }
.search input { width: 100%; font: inherit; font-size: 1rem; padding: 12px 44px 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.search input:focus { outline: none; border-color: var(--gold) }
.search svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--dim) }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none }
.filters button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: .8rem; font-weight: 700 }
.filters button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold) }
.res { display: flex; flex-direction: column; gap: 8px }
.res-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px }
.res-top { display: flex; align-items: center; gap: 8px }
.res-top .en { font-family: var(--serif); font-weight: 700; font-size: 1.05rem; direction: ltr; flex: 1; text-align: left; min-width: 0; overflow-wrap: anywhere }
.res-top .fa { font-weight: 800; color: var(--gold-2); font-size: .92rem }
.res-item p { margin: 0; font-size: .88rem; color: var(--muted) }
.res-item .acts { display: flex; gap: 6px; align-items: center }
.ib { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; padding: 0; color: var(--muted); flex: none }
.ib svg { width: 17px; height: 17px }
.ib.on { color: var(--gold); border-color: var(--gold) }
.learned { font-size: .7rem; color: var(--good); font-weight: 800 }
.more { text-align: center; color: var(--muted); font-size: .82rem }

/* league / dragon */
.league { display: flex; flex-direction: column; gap: 6px }
.lrow { display: grid; grid-template-columns: 26px 38px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line) }
.lrow.me { border: 2px solid var(--gold) }
.lrow .rk { font-weight: 900; color: var(--dim); text-align: center } .lrow.top3 .rk { color: var(--gold) }
.lrow .av { width: 38px; height: 38px; border-radius: 10px; overflow: hidden } .lrow .av img { width: 100%; height: 100%; object-fit: cover; display: block }
.lrow .nm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .lrow .nm small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; line-height: 1.3 }

.pct { text-align: center; font-weight: 800; font-size: 1.05rem } .pct span { color: var(--gold-2) }
.note { color: var(--muted); font-size: .78rem; text-align: center; margin: 0 }

.cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px }

.cell .ic img.locked { filter: grayscale(1) brightness(.22) blur(2px) }
.cell b { font-size: .8rem; line-height: 1.5 } .cell small { color: var(--muted); font-size: .7rem }
.stagebar { display: flex; gap: 4px } .stagebar i { flex: 1; height: 6px; border-radius: 99px; background: var(--raised) } .stagebar i.on { background: var(--gold) }
.name-form { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px }
.name-form label { font-weight: 800; font-size: .9rem }
.nf-row { display: flex; gap: 8px }
.nf-row input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 10px 12px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--bg); color: var(--fg) }

.tabs { position: fixed; inset: auto 0 0; background: rgba(18,22,28,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 8 }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr) }

.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 99px; background: var(--bad); color: #fff; font-size: .64rem; display: grid; place-items: center; padding: 0 4px }

/* evolution / reward overlay */
.evo { position: fixed; inset: 0; z-index: 30; background: rgba(6,8,12,.88); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
.evo[hidden] { display: none }
.evo-box { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 360px }
.evo-pet { width: 240px; max-width: 100%; aspect-ratio: 1; position: relative }
.evo-stack, .evo-stack > div { position: absolute; inset: 0 }
.evo-pet img, .evo-pet video { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 26px }
.evo-pet .flash { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(247,217,138,.85) 30%, transparent 65%); opacity: 0; pointer-events: none }
.evo.go .flash { animation: flash 1.6s ease-out .9s } .evo.go .old { animation: shakeOld .9s ease-in both } .evo .neu { opacity: 0 } .evo.go .neu { animation: popIn .7s cubic-bezier(.2,1.6,.4,1) 1.2s both }
.evo h3 { margin: 0; font-size: 1.45rem; font-weight: 900; color: var(--gold-2) } .evo p { margin: 0; color: #C9D3E2; font-size: .95rem }

.evo .chest-big { width: 140px; height: 140px; color: var(--gold) }
@keyframes flash { 0% { opacity: 0; transform: scale(.3) } 30% { opacity: 1; transform: scale(1.4) } 100% { opacity: 0; transform: scale(1.8) } }

</style>
