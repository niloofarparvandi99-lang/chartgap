  box.hidden = false; box.classList.remove('go'); void box.offsetWidth; box.classList.add('go');
}
function speak(t, btn) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g, '')); u.lang = 'en-US'; u.rate = .9; if (btn) { btn.classList.add('on'); u.onend = () => btn.classList.remove('on'); } speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; naming = false; render(); window.scrollTo({ top: 0 }); if (tab === 'map') scrollToCur(); return; }
  if (t.dataset.say) { speak(t.dataset.say, t); return; }
  if (t.id === 'pet') { t.classList.remove('poke'); void t.offsetWidth; t.classList.add('poke'); haptic(); return; }
  if (t.id === 'go-lesson' || t.id === 'go-extra') { startLesson(); return; }
  if (t.dataset.node !== undefined) {
    const n = +t.dataset.node;
    if (n === S.lessons) startLesson();
    else if (n < S.lessons) { run = { type: 'peek', ids: LESSONS[n].ids, step: 'learn', card: 0, qs: [], total: 1, right: 0 }; openScreen(); }
    else { haptic(); t.animate([{ transform: 'translate(50%,-50%) translateX(-4px)' }, { transform: 'translate(50%,-50%) translateX(4px)' }, { transform: 'translate(50%,-50%)' }], { duration: 250 }); }
    return;
  }
  if (t.dataset.chest !== undefined) {
    const li = +t.dataset.chest, l = LANDS[li];
    if (l.lessons[l.lessons.length - 1] < S.lessons) startChest(li); else haptic();
    return;
  }
  if (t.id === 'go-review') { startReview(); return; }
  if (t.id === 'close') { const ev = run && run.evolve; closeScreen(); if (ev) evolve(ev[0], ev[1]); return; }
  if (t.id === 'next-card') { if (run.card < run.ids.length - 1) { run.card++; renderScreen(); } else if (run.type === 'peek') closeScreen(); else { run.step = 'quiz'; renderScreen(); } return; }
  if (t.id === 'prev') { run.card--; renderScreen(); return; }
  if (t.dataset.pick && run && run.step === 'quiz' && !run.answered) {
    const q = run.qs[run.at], pick = +t.dataset.pick, ok = pick === q.idx;
    run.answered = { pick, ok }; haptic(ok ? 'ok' : 'no');
    const first = !q.retry;
    if (ok) run.right++;
    if (run.type === 'chest') { if (ok) run.firstTry++; else run.right++; }   // chest: one try per question
    else { if (!ok) { run.mistakes += first ? 1 : 0; run.qs.push(Object.assign({}, q, { retry: true, opts: shuffle(q.opts) })); } if (first) grade(q.idx, ok); }
    renderScreen(); return;
  }
  if (t.id === 'next-q') { if (run.at >= run.qs.length - 1) finishRun(); else { run.at++; run.answered = null; renderScreen(); } return; }
  if (t.id === 'more') { showN += 30; render(); return; }
  if (t.dataset.fl !== undefined) { qLand = +t.dataset.fl; onlyMarks = false; showN = 30; render(); return; }
  if (t.dataset.fm) { onlyMarks = !onlyMarks; qLand = -1; showN = 30; render(); return; }
  if (t.dataset.mark !== undefined) { const i = +t.dataset.mark, k = S.marks.indexOf(i); if (k >= 0) S.marks.splice(k, 1); else S.marks.push(i); save(); render(); return; }
  if (t.id === 'evo-ok') { $('#evo').hidden = true; return; }
  if (t.id === 'evo-name' || t.id === 'rename') { $('#evo').hidden = true; naming = true; nameErr = ''; nameDraft = S.petName; render(); setTimeout(() => { const i = $('#pet-name-input'); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } }, 50); return; }
  if (t.id === 'name-cancel') { naming = false; render(); return; }
  if (t.dataset.mood !== undefined) { preview = t.dataset.mood; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.id === 'd-next') { newDay(); save(); render(); scrollToCur(); return; }
  if (t.id === 'd-skip') { if (doneToday() || S.lastDone < 0) newDay(); newDay(); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.id === 'd-reset') { S = fresh(); preview = ''; save(); render(); return; }
  if (t.dataset.jump) {
    const n = +t.dataset.jump; S = fresh();
    S.today = n; S.lastDone = n - 1; S.streak = n; S.best = n; S.lessons = Math.min(n, LESSONS.length); S.freezes = 0;
    S.seen = STAGES.map((s, i) => i).filter(i => STAGES[i].at <= n);
    LESSONS.slice(0, S.lessons).forEach((L, k) => L.ids.forEach(i => { S.box[i] = [Math.min(4, Math.floor((n - k) / 5)), k + 3 + (i % 9)]; }));
    LANDS.forEach((l, li) => { if (l.lessons[l.lessons.length - 1] < S.lessons) S.chests.push(li); });
    preview = ''; tab = 'map'; save(); render(); scrollToCur(); return;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value; showN = 30; const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) {} } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'name-form') return; e.preventDefault();
  nameDraft = $('#pet-name-input').value; const r = checkName(nameDraft);
  if (!r.ok) { nameErr = r.msg; render(); const i = $('#pet-name-input'); if (i) { i.focus(); i.setAttribute('aria-invalid', 'true'); } return; }
  S.petName = r.name; naming = false; nameErr = ''; save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#evo').hidden) $('#evo').hidden = true; else if (run) closeScreen(); } });
function scrollToCur() { setTimeout(() => { const n = document.querySelector('.node.cur, .node.wait'); const y = n && n.getBoundingClientRect().top; if (n && (y > window.innerHeight * .8 || y < 60)) n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60); }

if (PROD) {
  if (!/[?&]demo=1/.test(location.search)) $('#demo').remove();
  $('#back').hidden = false;
  syncDay();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !run && syncDay()) { save(); render(); } });
  let tries = 0;
  const tgInit = () => {
    const t = window.Telegram && window.Telegram.WebApp;
    if (!t || !t.initData) { if (++tries < 40) setTimeout(tgInit, 100); return; }
    try { t.ready(); t.expand(); if (t.isVersionAtLeast('6.1')) { t.setHeaderColor('#12161C'); t.setBackgroundColor('#12161C'); } } catch (e) {}
    try { if (t.isVersionAtLeast('6.1')) { $('#back').hidden = true; t.BackButton.show(); t.BackButton.onClick(() => { if (!$('#evo').hidden) $('#evo').hidden = true; else if (run) closeScreen(); else location.href = '../'; }); } } catch (e) {}
    cloudLoad(() => { syncDay(); save(); if (!run) render(); });
  };
  tgInit();
}
render();
