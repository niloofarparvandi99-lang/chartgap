name: bot-look2
on:
  push:
    paths: ['.github/workflows/bot-look2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Capture etfbaz site and public channel posts
        run: |
          mkdir -p look-bots2
          cat > look.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
            const pages = [['etfbaz-site', 'https://www.etfbaz.com/'], ['etfbaz-channel', 'https://t.me/s/etfbaz'], ['mohsentahlil-channel', 'https://t.me/s/mohsentahlil']];
            for (const [n, u] of pages) {
              try {
                await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }); await p.waitForTimeout(2500);
                await p.screenshot({ path: `look-bots2/${n}.png`, fullPage: false });
                fs.writeFileSync(`look-bots2/${n}.txt`, u + '\n\n' + (await p.innerText('body')).slice(0, 20000));
              } catch (e) { fs.appendFileSync('look-bots2/errors.txt', u + ' ' + e.message + '\n'); }
            }
            await b.close();
          })();
          JS
          node look.js
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add look-bots2 && git commit -m "Capture etfbaz and channels" && git push
