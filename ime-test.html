<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست بورس کالا</title>
<style>body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0f1115;color:#e8e8e8;padding:16px;line-height:1.9}
.r{padding:10px 12px;border-radius:10px;margin:8px 0;background:#1b1f27}.ok{border-right:4px solid #3fb950}.no{border-right:4px solid #f85149}.w{border-right:4px solid #d29922}
small{color:#9aa}</style></head><body>
<h3>تست اتصال مستقیم به بورس کالا</h3>
<p><small>این صفحه رو بدون VPN باز کن و بعد از حدود ۲۰ ثانیه از نتیجه اسکرین‌شات بگیر.</small></p>
<div id="out"></div>
<script>
const B = 'https://cdn.ime.co.ir', out = document.getElementById('out');
const add = (cls, t) => { const d = document.createElement('div'); d.className = 'r ' + cls; d.textContent = t; out.appendChild(d); };
const conn = encodeURIComponent(JSON.stringify([{ name: 'marketshub' }]));
(async () => {
  let neg;
  try {
    const r = await fetch(`${B}/realTimeServer/negotiate?clientProtocol=2.1&connectionData=${conn}&_=${Date.now()}`, { signal: AbortSignal.timeout(15000) });
    neg = await r.json();
    add('ok', '۱. مذاکره: موفق ✅ (status ' + r.status + ')');
  } catch (e) { add('no', '۱. مذاکره: ناموفق ❌ ' + e.name + ' ' + e.message); }
  if (!neg) return add('w', 'نتیجه: مرورگر نمی‌تونه مستقیم وصل شه.');
  const q = `transport=serverSentEvents&clientProtocol=2.1&connectionToken=${encodeURIComponent(neg.ConnectionToken)}&connectionData=${conn}`;
  let n = 0, opts = 0, funds = 0, groups = new Set();
  const es = new EventSource(`${B}/realTimeServer/connect?${q}&tid=1`);
  es.onopen = () => { add('ok', '۲. اتصال زنده: باز شد ✅'); setTimeout(() => fetch(`${B}/realTimeServer/start?${q}&_=${Date.now()}`).then(r => add('ok', '۳. شروع: ' + r.status)).catch(e => add('no', '۳. شروع: ناموفق ' + e.message)), 1500); };
  es.onerror = () => add('no', '۲. اتصال زنده: خطا ❌');
  es.onmessage = ev => { n++; try { const o = JSON.parse(ev.data); for (const it of o.M || []) { const a = (it.A || [])[0];
    if (it.M === 'updateMarketsInfo' && Array.isArray(a)) { opts = a.length; a.forEach(d => groups.add(d.CommodityGroup)); }
    if (it.M === 'updateSandoqMarketsInfo' && Array.isArray(a)) funds = a.length; } } catch (e) {} };
  setTimeout(() => { es.close(); add(n ? 'ok' : 'no', `۴. پیام‌ها: ${n} · ردیف اختیار: ${opts} · صندوق: ${funds} · گروه‌ها: ${[...groups].join('، ')}`); }, 20000);
})();
</script></body></html>
